k</b><span>Japanese Romantic Waltz · Cinematic Chamber Pop</span><span class="ar">الريح أخذت إجازة مرضية</span></div></div><div class="ti"><span class="n" style="--c:#2d48a0">23</span><img src="sq-09.webp"><div class="tt"><b>Tamagotchi Luv</b><span>Dark R&amp;B · Alt R&amp;B</span><span class="ar">حبّ التاماغوتشي</span></div></div></div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Contents</span><span><b>02</b></span></div></section></template><template><section class="pg"><p class="sec">Welcome aboard · مرحبًا بكم · ようこそ</p><h1 class="h">A word from<br>your crew</h1>
<p class="dek">Okinawa… One Way… is a journey through Japan as seen through film, music and pop culture. Here’s how to travel it.</p>
<div class="pt"><h3><span>Japan, as you’ve experienced it</span><span class="ad">اليابان كما عشتَها</span></h3><p class="p">This isn’t an album trying to sound “traditionally Japanese”. It’s Japan as most of us actually meet it: through films, records, anime, toys and late-night internet rabbit holes.</p><p class="p ar">ليس ألبومًا يحاول أن يبدو «يابانيًّا تقليديًّا»، بل اليابان كما يلتقيها معظمنا فعلًا: عبر الأفلام والأسطوانات والأنمي والألعاب وجولات الإنترنت في آخر الليل.</p></div><div class="pt"><h3><span>Nine imaginary soundtracks</span><span class="ad">تسع موسيقى تصويرية متخيَّلة</span></h3><p class="p">Each song is the soundtrack to a film that doesn’t exist. Different stories, different eras, one shared cinematic universe.</p><p class="p ar">كلّ أغنية موسيقى تصويرية لفيلمٍ غير موجود. قصصٌ مختلفة، وعصورٌ مختلفة، وعالمٌ سينمائيّ واحد.</p></div><div class="pt"><h3><span>Big feelings for small things</span><span class="ad">مشاعر كبيرة لأشياء صغيرة</span></h3><p class="p">The narrators grieve what nobody else would: a recorded voice, a plastic flower, a half-heard song. The absurd is treated with complete sincerity.</p><p class="p ar">يحزن الرواة على ما لا يحزن عليه أحد: صوتٌ مسجَّل، وزهرةٌ بلاستيكية، وأغنيةٌ نصفُ مسموعة. ويُعامَل العبثيّ بصدقٍ كامل.</p></div><div class="pt"><h3><span>Freedom to move</span><span class="ad">حرّية التنقّل</span></h3><p class="p">The one-way ticket is permission to travel from 1960s garage rock to a Ghibli waltz without ever explaining yourself, and without going back.</p><p class="p ar">تذكرة الذهاب فقط إذنٌ بالسفر من روك الستينيات إلى فالس جيبلي دون تبريرٍ ودون عودة.</p></div><p class="sig">— LAY-L</p><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Welcome aboard</span><span><b>03</b></span></div></section></template><template><section class="pg feat"><div class="ph"></div><div class="in"><p class="sec">Feature · مقال · 特集</p>
<h1 class="h" style="font-size:40px">Why Okinawa?<br>Why one way?</h1>
<p class="p dc">In Quentin Tarantino’s Kill Bill: Vol. 1, The Bride walks up to an airline counter and asks for a one-way ticket to Okinawa. She isn’t planning to come back the same person. LAY-L borrowed that moment for the album’s title: a tribute to cinema, and a statement of direction. A one-way ticket means no return trip to a single sound. Every song is a new destination, with its own decade, genre and story.</p>
<p class="p ar">في فيلم «<bdi>Kill Bill: Vol. 1</bdi>» لكوينتن تارانتينو، تتقدّم «العروس» إلى مكتب طيران وتطلب تذكرة ذهابٍ فقط إلى أوكيناوا. لا تنوي أن تعود الشخصَ نفسه. استعارت <bdi>LAY-L</bdi> تلك اللحظة عنوانًا للألبوم: تحيّةً للسينما، وإعلانًا عن الاتجاه. تذكرة الذهاب فقط تعني ألّا عودة إلى صوتٍ واحد. كلّ أغنية وجهةٌ جديدة، بعقدها ونوعها وقصّتها.</p>
<hr class="rule"><span class="kb">THE KILL BILL THREAD</span><p class="p" style="margin-top:7px;font-size:13px">Kill Bill runs through the whole record: the title comes from it, Shura no Hana (track 05) plays in it, and The 5.6.7.8’s (track 06) perform in it.</p><p class="p ar" style="font-size:14px">يمتدّ «<bdi>Kill Bill</bdi>» عبر الألبوم كلّه: منه جاء العنوان، وفيه تُسمَع «<bdi>Shura no Hana</bdi>» (الأغنية <bdi>05)</bdi>، وفيه تعزف فرقة «<bdi>The 5.6.7.8’s</bdi>» (الأغنية <bdi>06).</bdi></p>

ral · Listening experience</span></div></div><div class="ch" style="--c:#c35e22"><span class="no"><small>CH</small>08</span><img src="sq-08.webp"><div><div class="t2"><b>The Wind Called In Sick</b><span class="ad">الريح أخذت إجازة مرضية</span></div><span class="g">Japanese Romantic Waltz · Cinematic Chamber Pop · Cinematic · Musical</span></div></div><div class="ch" style="--c:#2d48a0"><span class="no"><small>CH</small>09</span><img src="sq-09.webp"><div><div class="t2"><b>Tamagotchi Luv ★</b><span class="ad">حبّ التاماغوتشي</span></div><span class="g">Dark R&amp;B · Alt R&amp;B · Pop culture</span></div></div></div><p class="mono" style="font-size:8.5px;letter-spacing:.16em;color:#8c877c;margin-top:8px">★ BONUS TRACK · أغنية إضافية · ボーナストラック</p><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Entertainment</span><span><b>06</b></span></div></section></template><template><section class="pg dA" style="--acc:#8e3a8c"><div class="ph" style="background-image:url(sq-01.webp)"></div><div class="in">
<div class="top"><p class="sec">Destination 01 / 09</p><p class="sec" style="color:#8c877c">LYL 001</p></div>
<h1 class="h">One Missed Call.. Two…</h1><div class="subs"><span class="jm">不在着信…2件…</span><span class="ad">مكالمة فائتة… اثنتان…</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>Modern Japanese Hip-Hop · Club Rap</b></div><div><small>Era · الحقبة</small><b>Now</b></div><div><small>Japan link · الصلة</small><b>Instrumental · Cinematic</b><p class="ar">الآلات · السينما</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Bouncy, bass-heavy hip-hop with fierce female rap and a hypnotic three-note shamisen riff. The choruses are instrumental drops.</p><p class="p ar">هيب هوب نطّاط ثقيل الباص، وراب نسائي حادّ، وريف شاميسن منوِّم من ثلاث نغمات. أمّا الكورَس ففواصل موسيقية بلا غناء.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>One Missed Call.. Two…</span><span><b>07</b></span></div></section></template><template><section class="pg wimg" style="--acc:#8e3a8c"><div class="sph" style="background-image:url(mag/x-phone.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">Tick-tock, running late<br>You still don’t know how to play the game</p><div class="tr"><p class="jm">チクタク、遅刻だね<br>まだゲームのやり方もわからないの</p><p class="ar">تك-توك، تأخّرت<br>وما زلتَ لا تعرف كيف تلعب اللعبة</p></div></div>
<p class="p dc" style="font-size:15px">Someone keeps calling, convinced persistence will earn a reply. It won’t. As the missed calls pile up, a would-be confrontation turns into a gleeful display of indifference: the joy of refusing to take part in someone else’s drama.</p><p class="p ar" style="font-size:16.4px">شخصٌ ما يواصل الاتصال، مقتنعًا بأن الإلحاح سيجلب ردًّا. لن يحدث. ومع تراكم المكالمات الفائتة، تتحوّل المواجهة المحتملة إلى استعراضٍ مرحٍ للامبالاة، ومتعةِ رفض المشاركة في دراما الآخرين.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Instrumental · Cinematic · 楽器・映画</span>
<p class="p">Traditional Japanese instrumentation meets modern hip-hop: a three-note shamisen riff becomes the hook of a bass-heavy club track. The title also echoes Takashi Miike’s 2003 J-horror One Missed Call (着信アリ), where a ringing phone is the threat.</p><p class="p ar">تلتقي الآلات اليابانية التقليدية بالهيب هوب الحديث: ريف شاميسن من ثلاث نغمات يصبح لازمةَ أغنية نوادٍ ثقيلة الباص. ويذكّر العنوان أيضًا بفيلم الرعب الياباني «<bdi>One Missed Call</bdi>» عام <bdi>2003</bdi> لتاكاشي مييكه، حيث يكون رنين الهاتف هو الخطر.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · INDIFFERENCE, BOUNDARIES AND THE POWER OF SILENCE · 無関心、境界線、沈黙の力</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>One Missed Call.. Two…</span><span><b>08</b></span></div></section></template><template><section class="pg dA" style="--acc:#b06a1f"><div class="ph" style="background-image:url(sq-02.webp)"></div><div class="in">
<div class="top"><p class="sec">Destination 02 / 09</p><p class="sec" style="color:#8c877c">LYL 002</p></div>
<h1 class="h">Sakura</h1><div class="subs"><span class="jm">桜</span><span class="ad">ساكورا</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>Late-90s Alt R&amp;B · Neo-Soul · Boom-Bap</b></div><div><small>Era · الحقبة</small><b>1990s</b></div><div><small>Japan link · الصلة</small><b>Lyrical · Cultural</b><p class="ar">الكلمات · الثقافة</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Intimate late-90s R&amp;B at 72 BPM: melancholic Rhodes, dusty acoustic piano, laid-back boom-bap drums, warm bass, jazzy seventh chords and a husky, conversational voice.</p><p class="p ar"><bdi>R&amp;B</bdi> حميم من أواخر التسعينيات بسرعة <bdi>72</bdi> نبضة: بيانو رودز حزين، وبيانو صوتي مغبَّر، وطبول «بوم-باب» هادئة، وباص دافئ، وأوتار جازية، وصوتٌ أجشّ يشبه الحديث.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Sakura</span><span><b>09</b></span></div></section></template><template><section class="pg" style="--acc:#b06a1f"><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">Cold rice and tempura<br>You were talking through the morning</p><div class="tr"><p class="jm">冷めたご飯と天ぷら<br>朝まで話し続けたあなた</p><p class="ar">رزٌّ باردٌ وتمبورا<br>وأنتَ تتكلّم حتى الصباح</p></div></div>
<p class="p dc" style="font-size:15px">Someone keeps turning up, making themselves at home, then leaving without a word. She knows they’re unreliable, yet what she misses isn’t the relationship. It’s the small things: sitting on the floor, cold rice and tempura, talking about nothing until morning.</p><p class="p ar" style="font-size:16.4px">شخصٌ يظهر مرّةً بعد أخرى، يتصرّف وكأنه في بيته، ثم يرحل بلا كلمة. تعرف أنه لا يُعتمَد عليه، لكن ما تفتقده ليس العلاقة، بل التفاصيل الصغيرة: الجلوس على الأرض، رزٌّ بارد وتمبورا، والحديث عن لا شيء حتى الصباح.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Lyrical · Cultural · 歌詞・文化</span>
<p class="p">Sakura (桜) means cherry blossom, Japan’s most recognisable symbol, and the lyrics are full of everyday Japan: cold rice, tempura, sitting on the floor. The production is American late-90s neo-soul, so the link is lyrical and cultural rather than musical.</p><p class="p ar">«ساكورا» (桜) تعني زهر الكرز، أشهر رموز اليابان، والكلمات مليئة باليابان اليومية: رزٌّ بارد، وتمبورا، والجلوس على الأرض. أمّا الإنتاج فنيو-سول أمريكي من أواخر التسعينيات، لذا فالصلة لغويّة وثقافيّة أكثر منها موسيقيّة.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · TEMPORARY INTIMACY AND NOSTALGIA FOR ORDINARY MOMENTS · 束の間の親密さと、ありふれた瞬間への郷愁</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Sakura</span><span><b>10</b></span></div></section></template><template><section class="pg dA" style="--acc:#1d8466"><div class="ph" style="background-image:url(sq-03.webp)"></div><div class="in">
<div class="top"><p class="sec">Destination 03 / 09</p><p class="sec" style="color:#8c877c">LYL 003</p></div>
<h1 class="h">Lost in Japan</h1><div class="subs"><span class="jm">日本で迷子</span><span class="ad">تائهة في اليابان</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>90s Gospel-R&amp;B · Y2K Alt Pop</b></div><div><small>Era · الحقبة</small><b>Y2K</b></div><div><small>Japan link · الصلة</small><b>Geographic · Instrumental</b><p class="ar">المكان · الآلات</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Warm hip-hop grooves, intimate female verses, enormous gospel-choir choruses and a harmonising shamisen underneath it all.</p><p class="p ar">إيقاعات هيب هوب دافئة، ومقاطع نسائية حميمة، وجوقات غوسبل هائلة، وشاميسن متناغم يسري تحتها كلّها.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Lost in Japan</span><span><b>11</b></span></div></section></template><template><section class="pg wimg" style="--acc:#1d8466"><div class="sph" style="background-image:url(mag/x-crowd.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">Funny how a city you’ve never seen<br>Can feel familiar on the first night</p><div class="tr"><p class="jm">不思議ね、見たこともない街が<br>最初の夜から懐かしいなんて</p><p class="ar">غريبٌ كيف لمدينةٍ لم ترَها من قبل<br>أن تبدو مألوفةً منذ الليلة الأولى</p></div></div>
<p class="p dc" style="font-size:15px">A trip through Japan turns unexpectedly emotional. Matcha from a vending machine, the wrong train, a paper fortune carried off by the breeze: every new detail brings back someone who isn’t there. Hushed verses burst into huge gospel choruses.</p><p class="p ar" style="font-size:16.4px">رحلةٌ عبر اليابان تصبح عاطفيةً على نحوٍ غير متوقَّع. ماتشا من آلة بيع، وقطارٌ خاطئ، وورقةُ حظٍّ يحملها النسيم بعيدًا، وكلُّ تفصيلٍ جديد يستحضر شخصًا غائبًا. مقاطع هامسة تنفجر في جوقات غوسبل هائلة.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Geographic · Instrumental · 地理・楽器</span>
<p class="p">The album’s most geographically explicit song: train stations, vending-machine matcha, getting lost in Shibuya, a paper fortune from a stand. A shamisen harmonises beneath the gospel choir, and that clash is the song’s identity.</p><p class="p ar">أكثر أغاني الألبوم ارتباطًا بالمكان: محطّات القطار، وماتشا آلات البيع، والضياع في شيبويا، وورقة حظٍّ من كشك صغير. شاميسن يتناغم تحت جوقة الغوسبل، وهذا التضادّ هو هوية الأغنية.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · TRAVEL, AND FAMILIAR FEELINGS IN UNFAMILIAR PLACES · 旅と、見知らぬ場所で出会う懐かしい感情</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Lost in Japan</span><span><b>12</b></span></div></section></template><template><section class="pg dA" style="--acc:#b0262e"><div class="ph" style="background-image:url(sq-07.webp)"></div><div class="in">
<div class="top"><p class="sec">Destination 04 / 09</p><p class="sec" style="color:#8c877c">LYL 004</p></div>
<h1 class="h">Why Would I?</h1><div class="subs"><span class="jm">なぜ、私が？</span><span class="ad">ولماذا قد أفعل؟</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>1970s Japanese City Pop · Disco · Soul-Funk</b></div><div><small>Era · الحقبة</small><b>1979</b></div><div><small>Japan link · الصلة</small><b>Musical</b><p class="ar">الموسيقى</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Sophisticated city-pop disco: melodic basslines, warm electric piano, shimmering rhythm guitar, crisp live drums and lush harmonies made for dancing.</p><p class="p ar">ديسكو «سيتي بوب» راقٍ: خطوط باص لحنيّة، وبيانو كهربائي دافئ، وغيتار إيقاعي لامع، وطبول حيّة نقيّة، وتناغمات غنيّة تدعو إلى الرقص.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Why Would I?</span><span><b>13</b></span></div></section></template><template><section class="pg" style="--acc:#b0262e"><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">There’s a little difference<br>Between what I can and what I choose</p><div class="tr"><p class="jm">ちょっとした違いがあるの<br>「できること」と「選ぶこと」の間には</p><p class="ar">ثمّة فرقٌ صغير<br>بين ما أستطيعه وما أختاره</p></div></div>
<p class="p dc" style="font-size:15px">She could fix it. She could compromise, try again, make it work. Instead she asks a simpler question: why would I? No confrontation and no tears, just a disco groove and the easy confidence of choosing not to.</p><p class="p ar" style="font-size:16.4px">تستطيع إصلاح الأمر، والتنازل، والمحاولة من جديد. لكنها تطرح سؤالًا أبسط: ولماذا قد أفعل؟ لا مواجهة ولا دموع، بل إيقاعُ ديسكو وثقةٌ هادئة في اختيار ألّا تفعل.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Musical · 音楽</span>
<p class="p">Built on the golden age of Japanese city pop, the sleek urban pop of the late 70s and 80s. Its reference point is Miki Matsubara’s 1979 Mayonaka no Door (Stay With Me), which found a huge new global audience decades later.</p><p class="p ar">مبنيّة على العصر الذهبي لموسيقى «سيتي بوب» اليابانية، البوب الحضري الأنيق في أواخر السبعينيات والثمانينيات. مرجعها أغنية ميكي ماتسوبارا «<bdi>Mayonaka no Door</bdi>» عام <bdi>1979</bdi>، التي وجدت جمهورًا عالميًّا جديدًا بعد عقود.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · SELF-RESPECT AND PERSONAL CHOICE · 自尊心と、自分で選ぶこと</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Why Would I?</span><span><b>14</b></span></div></section></template><template><section class="pg dA" style="--acc:#2c6d66"><div class="ph" style="background-image:url(sq-04.webp)"></div><div class="in">
<div class="top"><p class="sec">Destination 05 / 09</p><p class="sec" style="color:#8c877c">LYL 005</p></div>
<h1 class="h">The Voice at Platform Two</h1><div class="subs"><span class="jm">二番線の声</span><span class="ad">الصوت عند المنصّة الثانية</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>1970s Enka · Kayōkyoku · Cinematic Ballad</b></div><div><small>Era · الحقبة</small><b>1973</b></div><div><small>Japan link · الصلة</small><b>Cinematic · Musical</b><p class="ar">السينما · الموسيقى</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Haunting enka in the spirit of Shura no Hana: restrained vocals, vintage electric guitar, delicate percussion and sweeping, bittersweet strings.</p><p class="p ar">إنكا مؤرِّقة على روح «<bdi>Shura no Hana</bdi>»: غناءٌ متحفّظ، وغيتار كهربائي عتيق، وإيقاع رقيق، ووتريّات واسعة حلوة ومرّة.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>The Voice at Platform Two</span><span><b>15</b></span></div></section></template><template><section class="pg wimg" style="--acc:#2c6d66"><div class="sph" style="background-image:url(mag/x-speaker.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">I watched a woman disappear<br>Who’d never lived at all</p><div class="tr"><p class="jm">消えていく女を見た<br>一度も生きていなかった女を</p><p class="ar">شاهدتُ امرأةً تختفي<br>امرأةً لم تكن موجودةً أصلًا</p></div></div>
<p class="p dc" style="font-size:15px">Every morning the same recorded voice asks passengers to stand behind the yellow line. One Tuesday it’s replaced. The trains still run on time and nobody notices, except her. A routine software update becomes a quiet, genuine tragedy.</p><p class="p ar" style="font-size:16.4px">كلَّ صباح، يطلب الصوتُ المسجَّل نفسُه من الركّاب الوقوفَ خلف الخطّ الأصفر. وذات ثلاثاء، يُستبدَل. تبقى القطارات في مواعيدها ولا يلاحظ أحد، إلّاها. تحديثٌ تقنيٌّ عاديّ يصبح مأساةً هادئةً وحقيقية.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Cinematic · Musical · 映画・音楽</span>
<p class="p">Directly inspired by Meiko Kaji’s Shura no Hana, the theme of the 1973 film Lady Snowblood, which Tarantino later used in Kill Bill: Vol. 1. It recreates the restrained, melancholic elegance of enka and kayōkyoku.</p><p class="p ar">مستوحاة مباشرةً من أغنية ميكو كاجي «<bdi>Shura no Hana</bdi>»، أغنيةِ فيلم «<bdi>Lady Snowblood</bdi>» عام <bdi>1973</bdi>، التي استخدمها تارانتينو لاحقًا في «<bdi>Kill Bill: Vol. 1</bdi>». وتستعيد الأناقة الحزينة المتحفّظة لموسيقى الإنكا والكايوكيوكو.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · ATTACHMENT TO THE FAMILIAR, AND UNEXPECTED GRIEF · 慣れ親しんだものへの愛着と、思いがけない喪失</p>

<h1 class="h">Plastic Flower</h1><div class="subs"><span class="jm">プラスチック・フラワー</span><span class="ad">زهرة بلاستيكية</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>1960s Japanese Garage Rock · Surf · Rockabilly</b></div><div><small>Era · الحقبة</small><b>1960s</b></div><div><small>Japan link · الصلة</small><b>Musical · Cinematic</b><p class="ar">الموسيقى · السينما</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Raw garage rock: twangy surf guitars, dirty fuzz, pounding stripped-down drums, rockabilly rhythms and shouted group chants.</p><p class="p ar">روك «غراج» خام: غيتارات «سيرف» رنّانة، وتشويش «فَز» متّسخ، وطبول قويّة بسيطة، وإيقاعات «روكابيلي»، وهتافات جماعية.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Plastic Flower</span><span><b>17</b></span></div></section></template><template><section class="pg wimg" style="--acc:#d2574b"><div class="sph" style="background-image:url(mag/x-flower.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">Who gave you permission to die?<br>You weren’t even alive!</p><div class="tr"><p class="jm">誰が死んでいいって言ったの？<br>生きてもいなかったくせに！</p><p class="ar">من أذِن لكِ أن تموتي؟<br>لم تكوني حيّةً أصلًا!</p></div></div>
<p class="p dc" style="font-size:15px">A waitress throws away her favourite fake rose. Everyone says it’s replaceable; it was never alive. She buys an identical one, but it stands up much too straight. A trivial loss blown up into a shouted, fuzz-drenched catastrophe.</p><p class="p ar" style="font-size:16.4px">نادلةٌ ترمي وردتها البلاستيكية المفضّلة. الجميع يقول إنها قابلةٌ للاستبدال، فهي لم تكن حيّةً أصلًا. تشتري واحدةً مطابقة، لكنها تقف مستقيمةً أكثر من اللازم. خسارةٌ تافهة تتضخّم إلى كارثةٍ صاخبة.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Musical · Cinematic · 音楽・映画</span>
<p class="p">Inspired by The 5.6.7.8’s, the Tokyo garage-rock band who perform in Kill Bill: Vol. 1. Their sound reinterprets 50s and 60s American rockabilly and surf through Japan’s underground rock scene.</p><p class="p ar">مستوحاة من فرقة «<bdi>The 5.6.7.8’s</bdi>»، فرقة الروك من طوكيو التي تعزف في «<bdi>Kill Bill: Vol. 1</bdi>». يعيد صوتها تفسير روكابيلي وسيرف الخمسينيات والستينيات الأمريكي عبر مشهد الروك الياباني المستقلّ.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · THE VALUE OF “WORTHLESS” THINGS · 「価値のないもの」の価値</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>Plastic Flower</span><span><b>18</b></span></div></section></template><template><section class="pg dA" style="--acc:#c2306a"><div class="ph" style="background-image:url(sq-06.webp)"></div><div class="in">

<h1 class="h">ASMR Stimulation</h1><div class="subs"><span class="jm">ASMR・スティミュレーション</span><span class="ad">تحفيز <bdi>ASMR</bdi></span></div>
<div class="facts"><div><small>Genre · النوع</small><b>Dark Electro-Funk · Alt R&amp;B · Trip-Hop</b></div><div><small>Era · الحقبة</small><b>Now</b></div><div><small>Japan link · الصلة</small><b>Cultural · Listening experience</b><p class="ar">الثقافة · تجربة الاستماع</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">Dark electro-funk: deep elastic bass, hypnotic trip-hop rhythms, intimate vocals with male interjections, tactile percussion and binaural sound design.</p><p class="p ar">إلكترو-فانك داكن: باص عميق مرن، وإيقاعات «تريب-هوب» منوِّمة، وغناءٌ حميم تتخلّله مداخلات رجاليّة، وإيقاعات ملموسة، وتصميم صوتي مجسَّم.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>ASMR Stimulation</span><span><b>19</b></span></div></section></template><template><section class="pg wimg" style="--acc:#c2306a"><div class="sph" style="background-image:url(mag/x-mouth.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">Don’t get to the point<br>I prefer the scenic route</p><div class="tr"><p class="jm">本題に入らないで<br>遠回りのほうが好きなの</p><p class="ar">لا تدخل في صُلب الموضوع<br>أفضّل الطريق الأطول والأجمل</p></div></div>
<p class="p dc" style="font-size:15px">An ordinary conversation becomes a seduction. Pauses, breaths, pronunciation and polite bureaucratic phrases take on double meanings, and the whole game is in the waiting. Clicks, whispers and binaural stereo make the sound itself the object of desire.</p><p class="p ar" style="font-size:16.4px">محادثةٌ عادية تتحوّل إلى إغواء. الوقفات والأنفاس والنطق والعبارات الرسمية المهذّبة تكتسب معانيَ مزدوجة، واللعبة كلّها في الانتظار. نقراتٌ وهمساتٌ وصوتٌ مجسَّم تجعل الصوتَ نفسَه موضعَ الرغبة.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Cultural · Listening experience · 文化・聴く体験</span>
<p class="p">Japan has one of the world’s most developed ASMR cultures: mimikaki (耳かき) ear-cleaning recordings, binaural audio and “situation voice” performances. Here the Japanese influence isn’t in the instruments or melody, but in the listening experience itself.</p><p class="p ar">تمتلك اليابان واحدةً من أكثر ثقافات الـ<bdi>ASMR</bdi> تطوّرًا في العالم: تسجيلات «ميميكاكي» لتنظيف الأذن، والصوت المجسَّم، وعروض «الصوت التمثيلي». التأثير الياباني هنا ليس في الآلات أو اللحن، بل في تجربة الاستماع نفسها.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · AUDITORY PLEASURE AND THE SEDUCTION OF ANTICIPATION · 聴く快楽と、焦らしの誘惑</p>
<div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>ASMR Stimulation</span><span><b>20</b></span></div></section></template><template><section class="pg dA" style="--acc:#c35e22"><div class="ph" style="background-image:url(sq-08.webp)"></div><div class="in">

<h1 class="h">The Wind Called In Sick</h1><div class="subs"><span class="jm">風が病欠した日</span><span class="ad">الريح أخذت إجازة مرضية</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>Japanese Romantic Waltz · Cinematic Chamber Pop</b></div><div><small>Era · الحقبة</small><b>2004</b></div><div><small>Japan link · الصلة</small><b>Cinematic · Musical</b><p class="ar">السينما · الموسيقى</p></div></div>
<div class="lis"><small>What to listen for · ماذا تسمع</small><p class="p">A melancholic romantic waltz in 3/4: expressive piano, dancing violins, lyrical cello and minimal, delicate vocals.</p><p class="p ar">فالس رومانسي حزين بإيقاع ثلاثي: بيانو معبِّر، وكمنجات راقصة، وتشيلو غنائي، وغناءٌ رقيق قليل.</p></div>
</div><div class="folio"><span><b>ONE WAY</b> · Issue Nº 2</span><span>The Wind Called In Sick</span><span><b>21</b></span></div></section></template><template><section class="pg wimg" style="--acc:#c35e22"><div class="sph" style="background-image:url(mag/x-wind.webp)"></div><p class="sec">The story · القصة · ストーリー</p>
<div class="pq"><p class="en">It comes to me in pieces<br>And leaves before it ends</p><div class="tr"><p class="jm">かけらになってやって来て<br>終わる前に去っていく</p><p class="ar">يأتيني على شكل قِطَع<br>ويرحل قبل أن ينتهي</p></div></div>
<p class="p dc" style="font-size:15px">One afternoon the wind simply stops. In the stillness, a woman sings from an upstairs window and never reaches the last line. The melody stays half-remembered until, walking home, she sings the ending wrong. A small waltz about memory and the beauty of unfinished things.</p><p class="p ar" style="font-size:16.4px">ذات ظهيرة، تتوقّف الريح ببساطة. في السكون، تغنّي امرأةٌ من نافذةٍ علوية ولا تصل أبدًا إلى السطر الأخير. يبقى اللحن نصفَ متذكَّر، حتى تغنّي نهايته خطأً في طريق العودة. فالسٌ صغير عن الذاكرة وجمال الأشياء غير المكتملة.</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Cinematic · Musical · 映画・音楽</span>
<p class="p">Inspired by Joe Hisaishi’s Merry-Go-Round of Life from Studio Ghibli’s Howl’s Moving Castle. It explores the romantic, melancholic side of Japanese film scoring: a European-style waltz with Hisaishi’s melodic sensibility.</p><p class="p ar">مستوحاة من مقطوعة جو هيسايشي «<bdi>Merry-Go-Round of Life</bdi>» من فيلم استوديو جيبلي «قلعة هاول المتحرّكة». تستكشف الجانب الرومانسي الحزين من الموسيقى السينمائية اليابانية: فالسٌ أوروبيّ الطابع بحسّ هيسايشي اللحني.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · MEMORY, IMPERMANENCE AND UNFINISHED THINGS · 記憶、無常、未完成の美</p>

<h1 class="h">Tamagotchi Luv</h1><div class="subs"><span class="jm">たまごっち・ラヴ</span><span class="ad">حبّ التاماغوتشي</span></div>
<div class="facts"><div><small>Genre · النوع</small><b>Dark R&amp;B · Alt R&amp;B</b></div><div><small>Era · الحقبة</small><b>1996</b></div><div><small>Japan link · الصلة</small><b>Pop culture</b><p class="ar">الثقافة الشعبية</p></div></div>

<div class="pq"><p class="en">You call it love but it’s luv with a u<br>You can’t call it love when it’s only you</p><div class="tr"><p class="jm">それを愛と呼ぶけど、綴りがひとつ違う<br>あなただけなら、愛とは呼べない</p><p class="ar">تسمّيه حبًّا، لكنه حبٌّ ناقصُ حرف<br>لا يُسمّى حبًّا إن كنتَ وحدك فيه</p></div></div>
<p class="p dc" style="font-size:15px">Love as a virtual pet: fed when it’s convenient, ignored when it isn’t, kept alive at a distance. A 90s toy’s innocence against the control games of adult relationships, and the question of whether you care for someone or just like being needed.</p><p class="p ar" style="font-size:16.4px">الحبّ كحيوانٍ أليفٍ افتراضي: يُطعَم حين يكون ذلك مريحًا، ويُهمَل حين لا يكون، ويبقى حيًّا عن بُعد. براءةُ لعبةٍ من التسعينيات في مواجهة ألعاب السيطرة في علاقات الكبار، والسؤال: هل تهتمّ بشخصٍ ما، أم تحبّ فقط أن يحتاجك؟</p>
<div class="box"><div class="hd"><b>Connection to Japan</b><span class="ad">الصلة باليابان</span></div><span class="ty">Pop culture · ポップカルチャー</span>
<p class="p">Built on Tamagotchi, the virtual pet Bandai launched in Japan in November 1996, which had to be fed and cared for to stay alive. That 90s Japanese pop-culture icon becomes a metaphor for love and control.</p><p class="p ar">مبنيّة على «تاماغوتشي»، الحيوان الأليف الافتراضي الذي أطلقته «بانداي» في اليابان في نوفمبر <bdi>1996</bdi>، والذي يحتاج إلى إطعام ورعاية كي يبقى حيًّا. تتحوّل هذه الأيقونة اليابانية إلى استعارة للحبّ والسيطرة.</p></div>
<p class="mono" style="margin-top:10px;font-size:9px;letter-spacing:.12em;color:#6a6760">THEME · CONDITIONAL AFFECTION AND THE NEED TO BE NEEDED · 条件付きの愛情と、必要とされたい欲求</p>

(function(){
  var tpls=[].slice.call(document.querySelectorAll("template")), N=tpls.length, stage=document.getElementById("stage");
  function spreadMode(){ return innerWidth>=900 && innerWidth/innerHeight>1.05; }
  function views(){
    if(!spreadMode()) return tpls.map(function(_,i){return [i];});
    var v=[[0],[1]]; for(var i=2;i<N-1;i+=2){ v.push(i+1<N-1?[i,i+1]:[i]); } v.push([N-1]); return v;
  }
  var V=[], cur=0, built={};
  function el(i){ if(!built[i]){ var d=document.createElement("div"); d.appendChild(tpls[i].content.cloneNode(true)); built[i]=d.firstElementChild; } return built[i]; }
  function vIndexOfPage(p){ for(var k=0;k<V.length;k++) if(V[k].indexOf(p)>=0) return k; return 0; }
  var box=document.createElement("div"); box.className="view"; stage.appendChild(box);
  function render(){
    var pages=V[cur], w=0, h=0; box.innerHTML="";
    pages.forEach(function(p,j){ var e=el(p); var pw=e.classList.contains("pg34")?540:540, ph=e.classList.contains("pg34")?720:960;
      e.style.left=w+"px"; box.appendChild(e); w+=pw; h=Math.max(h,ph); });
    if(pages.length==2){ var g=document.createElement("div"); g.className="gut"; g.style.left="540px"; box.appendChild(g); }
    var r=stage.getBoundingClientRect(), pad=innerWidth<700?8:70;
    var s=Math.min((r.width-pad*2)/w,(r.height-16)/h);
    box.style.width=w+"px"; box.style.height=h+"px";
    box.style.transform="scale("+s+") translate("+(-w/2)+"px,"+(-h/2)+"px)";
    box.classList.remove("on"); void box.offsetWidth; box.classList.add("on");
    var first=pages[0]+1, last=pages[pages.length-1]+1;
    document.getElementById("pc").textContent=(first==last?pad2(first):pad2(first)+"–"+pad2(last))+" / "+pad2(N);
    document.getElementById("bar").style.width=(100*last/N)+"%";
    document.getElementById("prev").disabled=cur==0; document.getElementById("next").disabled=cur==V.length-1;
    try{ history.replaceState(null,"","#p"+first); }catch(e){}
  }
  function pad2(n){return (n<10?"0":"")+n;}
  function go(k){ cur=Math.max(0,Math.min(V.length-1,k)); render(); }
  function gotoPage(p){ go(vIndexOfPage(p)); }
  function layout(){ var p=V.length?V[cur][0]:0; V=views(); cur=vIndexOfPage(p); render(); }
  document.getElementById("prev").onclick=function(){go(cur-1);};
  document.getElementById("next").onclick=function(){go(cur+1);};
  addEventListener("keydown",function(e){ if(e.key=="ArrowRight"||e.key=="PageDown"||e.key==" ") {e.preventDefault();go(cur+1);} if(e.key=="ArrowLeft"||e.key=="PageUp") go(cur-1); });
  var x0=null,y0=null;
  stage.addEventListener("pointerdown",function(e){x0=e.clientX;y0=e.clientY;});
  stage.addEventListener("pointerup",function(e){ if(x0==null)return; var dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){ go(cur+(dx<0?1:-1)); return; }
    var ti=e.target.closest&&e.target.closest(".ti"); if(ti&&Math.abs(dx)<8){ var n=parseInt((ti.querySelector(".n")||{}).textContent,10); if(n) gotoPage(n-1); } });
  addEventListener("resize",layout);
  V=views(); var m=/#p(\d+)/.exec(location.hash); if(m) cur=vIndexOfPage(Math.min(N,+m[1])-1);
  render();
})();
</script></body></html>
