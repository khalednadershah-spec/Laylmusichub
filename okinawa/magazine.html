<div class="over"><div class="kick lt">Welcome aboard · ようこそ</div><h2 class="h1 lt big">A one-way ticket to a Japan you already know.</h2>
<p class="lede lt">Okinawa… One Way… is a journey through Japan as seen through film, music and pop culture: a run of imaginary film soundtracks, each from a different decade and genre, all sharing one cinematic universe.</p><p class="ar lt" dir="rtl" lang="ar">«أوكيناوا… ذهاب بلا عودة…» رحلةٌ في اليابان كما تراها السينما والموسيقى والثقافة الشعبية: سلسلةٌ من الموسيقى التصويرية لأفلامٍ متخيَّلة.</p></div><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Welcome aboard</span><span class="pn">04</span></div></section></template><template><section class="pg"><img class="topimg" src="mag/x-ticket.webp" alt=""><div class="kick">Feature · 特集</div><h2 class="h1">Why Okinawa?<br>Why one way?</h2>
<p class="body drop">In Quentin Tarantino’s Kill Bill: Vol. 1, The Bride walks up to an airline counter and asks for a one-way ticket to Okinawa. She isn’t planning to come back the same person.</p><p class="body">LAY-L borrowed that moment for the album’s title: a tribute to cinema, and a statement of direction. A one-way ticket means no return trip to a single sound.</p>
<p class="ja">『キル・ビル』はこのアルバムの出発点。タイトルの由来であり、劇中の「修羅の花」とThe 5.6.7.8’sがチャンネル06と07のインスピレーションに。</p><div class="folio"><span>ONE WAY · Issue 01</span><span>Feature</span><span class="pn">05</span></div></section></template><template><section class="pg dark"><img class="bleed" src="mag/x-crowd.webp" alt="" style="object-position:50% 50%"><div class="shade"></div>
<div class="over"><div class="kick lt">The idea · コンセプト</div><h2 class="h1 lt huge">Japan,<br>as you’ve<br>lived it.</h2></div><div class="folio dk"><span>ONE WAY · Issue 01</span><span>The idea</span><span class="pn">06</span></div></section></template><template><section class="pg"><img class="bleed" src="mag/b-clouds.webp" alt=""><div class="cloudwash"></div><div class="ideas over2"><div class="idea"><span>01</span><h3>Japan, as you’ve experienced it</h3><em lang="ja">体験としての日本</em><p>This isn’t an album trying to sound “traditionally Japanese”.</p></div><div class="idea"><span>02</span><h3>A run of imaginary soundtracks</h3><em lang="ja">架空のサウンドトラック</em><p>Each song is the soundtrack to a film that doesn’t exist.</p></div><div class="idea"><span>03</span><h3>Big feelings for small things</h3><em lang="ja">小さなものへの大きな感情</em><p>The narrators grieve what nobody else would: a recorded voice, a plastic flower, a half-heard song.</p></div><div class="idea"><span>04</span><h3>Freedom to move</h3><em lang="ja">移動する自由</em><p>The one-way ticket is permission to travel from 1960s garage rock to a Ghibli waltz without ever explaining yourself, and without going back.</p></div></div><div class="folio"><span>ONE WAY · Issue 01</span><span>The idea</span><span class="pn">07</span></div></section></template><template><section class="pg"><div class="kick red">In-flight entertainment · 機内エンターテインメント</div><h2 class="h1">Fourteen channels.<br>One cinematic universe.</h2><div class="guide"><div class="ti ch"><span class="n" hidden>10</span><img src="mag/p-01.webp" alt="" loading="lazy">

<blockquote class="pq">“Cold rice and tempura / You were talking through the morning”</blockquote>
<p class="body">Someone keeps turning up, making themselves at home, then leaving without a word. She knows they’re unreliable, yet what she misses isn’t the relationship.</p>
<p class="jp"><b>Japan</b> Sakura (桜), the cherry blossom and Japan’s best-known symbol, plus tempura and everyday intimacy, set to late-90s neo-soul.</p>

<blockquote class="pq">“Funny how a city you’ve never seen / Can feel familiar on the first night”</blockquote>
<p class="body">A trip through Japan turns unexpectedly emotional. Matcha from a vending machine, the wrong train, a paper fortune carried off by the breeze: every new detail brings back someone who isn’t there.</p>
<p class="jp"><b>Japan</b> The album’s most explicit link to Japan: Shibuya, train stations and vending machines, with a harmonising shamisen beneath the choir.</p>

<div class="pb"><div class="kick">Jealousy, language and attitude</div>
<blockquote class="pq">“You like winter, cold like refrigerator / My bag is alligator”</blockquote>
<p class="body">A jealous girlfriend, a cold boyfriend, and not quite enough English to say everything she feels, so she says it anyway. Refrigerator turns broken grammar into pure attitude: absurd, bouncy and completely sincere.</p>
<p class="jp"><b>Japan</b> Anyone who learned English in Japan knows the flashcard: a picture, a word, and the katakana underneath to help you say it.</p>

<div class="over"><div class="chno">12</div><h2 class="ctitle">The Wind Called In Sick</h2><div class="cja" lang="ja">最後の一行が、思い出せない。</div><div class="cen">I can’t remember the last line.</div></div>
<div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 12</span><span class="pn">30</span></div></section></template><template><section class="pg dark"><img class="poster" src="mag/p-12.webp" alt="The Wind Called In Sick poster" loading="lazy">
<div class="pb"><div class="kick">Memory, impermanence and unfinished things</div>
<blockquote class="pq">“It comes to me in pieces / And leaves before it ends”</blockquote>
<p class="body">One afternoon the wind simply stops. In the stillness, a woman sings from an upstairs window and never reaches the last line.</p>
<p class="jp"><b>Japan</b> Inspired by Joe Hisaishi’s Merry-Go-Round of Life from Studio Ghibli’s Howl’s Moving Castle.</p>

<div class="over"><div class="chno">13</div><h2 class="ctitle">Tamagotchi Luv</h2><div class="cja" lang="ja">それは、愛なのか——？</div><div class="cen">Is that love—?</div></div>
<div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 13</span><span class="pn">32</span></div></section></template><template><section class="pg dark"><img class="poster" src="mag/p-13.webp" alt="Tamagotchi Luv poster" loading="lazy">
<div class="pb"><div class="kick">Conditional affection and the need to be needed</div>
<blockquote class="pq">“You call it love but it’s luv with a u / You can’t call it love when it’s only you”</blockquote>
<p class="body">Love as a virtual pet: fed when it’s convenient, ignored when it isn’t, kept alive at a distance. A 90s toy’s innocence against the control games of adult relationships, and the question of whether you care for someone or just like being needed.</p>
<p class="jp"><b>Japan</b> Built on Tamagotchi, the virtual pet Bandai launched in Japan in November 1996.</p>

<div class="over"><div class="chno">14</div><h2 class="ctitle">Voodoo Doll</h2><div class="cja" lang="ja">呪われたのは、誰？</div><div class="cen">Who’s the cursed one?</div></div>
<div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 14</span><span class="pn">34</span></div></section></template><template><section class="pg dark"><img class="poster" src="mag/p-14.webp" alt="Voodoo Doll poster" loading="lazy">
<div class="pb"><div class="kick">Revenge, theatre and a wink</div>
<blockquote class="pq">“Hocus pocus, can’t you see? / The only disappearing act is you leaving me”</blockquote>
<p class="body">He cheated; she’s a witch. Voodoo Doll is a theatrical revenge spell with a wink: the purse goes to a friend, the pin goes in the doll, and the only disappearing act left is him leaving.</p>
<p class="jp"><b>Japan</b> Japan has its own curse doll: the wara ningyō, a straw figure nailed to a shrine tree at the hour of the ox, between 1 and 3 a.m.</p>

<div class="ad-tx"><b>Listen<br>on board.</b><span>Fourteen channels · Synced lyrics</span></div></section></template><template><section class="pg cover"><img class="bleed" src="mag/x-back2.webp" alt="ONE WAY back cover"></section></template><script>
(function(){
  var tpls=[].slice.call(document.querySelectorAll("template")), N=tpls.length, one=false, V=[];
  var stage=document.getElementById("stage"), book=document.createElement("div"); book.className="book"; stage.appendChild(book);
  var L=document.createElement("div"),R=document.createElement("div"),sp=document.createElement("div");
  L.className="slot l";R.className="slot r";sp.className="spine";book.appendChild(L);book.appendChild(R);book.appendChild(sp);
  function build(){ V=[]; if(one){ for(var i=0;i<N;i++) V.push([i]); return; }
    V.push([null,0]); for(var i=1;i<N-1;i+=2) V.push([i,i+1<N-1?i+1:null]); V.push([N-1,null]); }
  function page(i){ if(i===null||i===undefined) return null; var d=document.createElement("div"); d.appendChild(tpls[i].content.cloneNode(true)); return d.firstElementChild; }
  function fill(slot,i){ slot.innerHTML=""; var e=page(i); if(e) slot.appendChild(e); }
  var cur=0, busy=false;
  function size(){ var r=stage.getBoundingClientRect(), w=one?600:1200, pad=innerWidth<820?8:76, s=Math.min((r.width-pad*2)/w,(r.height-16)/800);
    book.style.transform="scale("+s+") translate("+(-w/2)+"px,-400px)"; }
  function pad2(n){return (n<10?"0":"")+n;}
  function first(){ return V[cur].filter(function(x){return typeof x==="number";})[0]; }
  function status(){ var a=V[cur].filter(function(x){return typeof x==="number";}); var f=a[0]+1, l=a[a.length-1]+1;
    document.getElementById("pc").textContent=(f==l?pad2(f):pad2(f)+"–"+pad2(l))+" / "+pad2(N);
    document.getElementById("bar").style.width=(100*l/N)+"%";
    sp.style.display=(one||V[cur][0]===null||V[cur][1]===null)?"none":"";
    document.getElementById("prev").disabled=cur==0; document.getElementById("next").disabled=cur==V.length-1;
    try{history.replaceState(null,"","#p"+f);}catch(e){} }
  function show(){ fill(L,V[cur][0]); if(!one) fill(R,V[cur][1]); else R.innerHTML=""; status(); }
  function go(p){ for(var q=0;q<V.length;q++) if(V[q].indexOf(p)>=0){ cur=q; show(); return; } }
  function flip(dir){
    if(busy) return; var k=cur+dir; if(k<0||k>=V.length) return;
    if(one){ cur=k; L.classList.remove("in","inb"); void L.offsetWidth; fill(L,V[cur][0]); L.classList.add(dir>0?"in":"inb"); status(); return; }
    busy=true;
    var A=V[cur], Bv=V[k], leaf=document.createElement("div"), fr=document.createElement("div"), bk=document.createElement("div");
    fr.className="face f"; bk.className="face b";
    var f1=page(dir>0?A[1]:A[0]), f2=page(dir>0?Bv[0]:Bv[1]); if(f1) fr.appendChild(f1); if(f2) bk.appendChild(f2);
    leaf.className="leaf "+(dir>0?"r":"l"); leaf.appendChild(fr); leaf.appendChild(bk); book.appendChild(leaf);
    if(dir>0) fill(R,Bv[1]); else fill(L,Bv[0]);
    sp.style.display="";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ leaf.style.transform="rotateY("+(dir>0?-180:180)+"deg)"; }); });
    setTimeout(function(){ cur=k; if(dir>0) fill(L,Bv[0]); else fill(R,Bv[1]); leaf.remove(); status(); busy=false; }, 780);
  }
  function mode(){ var o=innerWidth<820||innerHeight>innerWidth*1.05; if(o===one&&V.length) return size();
    var p=V.length?first():0; one=o; document.body.classList.toggle("one",one); build(); cur=0; go(p); size(); }
  document.getElementById("prev").onclick=function(){flip(-1);};
  document.getElementById("next").onclick=function(){flip(1);};
  addEventListener("keydown",function(e){ if(e.key=="ArrowRight") flip(1); if(e.key=="ArrowLeft") flip(-1); });
  stage.addEventListener("click",function(e){ if(e.target.closest("a")) return; var ti=e.target.closest(".ti"); if(!ti||busy) return;
    var n=parseInt((ti.querySelector(".n")||{}).textContent,10); if(n) go(n-1); });
  addEventListener("resize",mode);
  var m=/#p(\d+)/.exec(location.hash), start=m?+m[1]-1:0;
  one=innerWidth<820||innerHeight>innerWidth*1.05; document.body.classList.toggle("one",one); build(); go(start); size();
})();
</script></body></html>
