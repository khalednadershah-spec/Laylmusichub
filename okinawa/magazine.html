<div class="kick mt">Now showing · 上映中</div><div class="toc chs"><div class="ti sm"><span class="n">10</span><span class="tt"><b>CH 01 · One Missed Call.. Two…</b></span></div><div class="ti sm"><span class="n">12</span><span class="tt"><b>CH 02 · Sakura</b></span></div><div class="ti sm"><span class="n">14</span><span class="tt"><b>CH 03 · Lost in Japan</b></span></div><div class="ti sm"><span class="n">16</span><span class="tt"><b>CH 04 · Why Would I?</b></span></div><div class="ti sm"><span class="n">18</span><span class="tt"><b>CH 06 · The Voice at Platform Two</b></span></div><div class="ti sm"><span class="n">20</span><span class="tt"><b>CH 07 · Plastic Flower</b></span></div><div class="ti sm"><span class="n">22</span><span class="tt"><b>CH 08 · Crickets</b></span></div><div class="ti sm"><span class="n">24</span><span class="tt"><b>CH 09 · SAdTURN</b></span></div><div class="ti sm"><span class="n">26</span><span class="tt"><b>CH 10 · ASMR Stimulation</b></span></div><div class="ti sm"><span class="n">28</span><span class="tt"><b>CH 11 · Refrigerator</b></span></div><div class="ti sm"><span class="n">30</span><span class="tt"><b>CH 12 · The Wind Called In Sick</b></span></div><div class="ti sm"><span class="n">32</span><span class="tt"><b>CH 13 · Tamagotchi Luv</b></span></div><div class="ti sm"><span class="n">34</span><span class="tt"><b>CH 14 · Voodoo Doll</b></span></div></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Contents</span><span class="pn">03</span></div></section></template><template><section class="pg"><div class="kick">Welcome aboard · ようこそ</div><h2 class="h1">A one-way ticket to a Japan you already know</h2>
<div class="lede">Okinawa… One Way… is a journey through Japan as seen through film, music and pop culture: a run of imaginary film soundtracks, each from a different decade and genre, all sharing one cinematic universe.</div><p class="body">The title comes from Quentin Tarantino’s Kill Bill: Vol. 1, where The Bride asks for a one-way ticket to Okinawa. For LAY-L, that ticket is a promise: the freedom to travel between sounds and never return to the same one twice.</p><p class="body">From 1960s garage rock and 1970s enka to city-pop disco, 90s R&amp;B, modern Japanese hip-hop and a Ghibli-style waltz, the songs follow fleeting relationships, strange attachments and ordinary things that turn out to matter. Some stories are absurd, some intimate, some provocative, and every one is sung with complete sincerity.</p>
<div class="rule"></div><p class="ja" lang="ja">『沖縄…片道…』は、映画・音楽・ポップカルチャーを通して見た日本を旅するアルバム。年代もジャンルも異なる「架空の映画のサウンドトラック」たちが、ひとつのシネマティックな世界を共有する。</p><p class="ar" dir="rtl" lang="ar">«أوكيناوا… ذهاب بلا عودة…» رحلةٌ في اليابان كما تراها السينما والموسيقى والثقافة الشعبية: سلسلةٌ من الموسيقى التصويرية لأفلامٍ متخيَّلة، لكلٍّ منها عقدُها وأسلوبها، ويجمعها عالمٌ سينمائيٌّ واحد.</p>
<div class="sign">— LAY-L, your crew on this flight</div><div class="folio"><span>ONE WAY · Issue 01</span><span>Welcome aboard</span><span class="pn">04</span></div></section></template><template><section class="pg"><img class="topimg" src="mag/x-ticket.webp" alt=""><div class="kick">Feature · 特集</div><h2 class="h1">Why Okinawa? Why one way?</h2>
<p class="body drop">In Quentin Tarantino’s Kill Bill: Vol. 1, The Bride walks up to an airline counter and asks for a one-way ticket to Okinawa. She isn’t planning to come back the same person.</p><p class="body">LAY-L borrowed that moment for the album’s title: a tribute to cinema, and a statement of direction. A one-way ticket means no return trip to a single sound. Every song is a new destination, with its own decade, genre and story.</p><p class="body">Kill Bill runs through the whole record: the title comes from it, Shura no Hana (channel 06) plays in it, and The 5.6.7.8’s (channel 07) perform in it.</p>
<div class="rule"></div><p class="ja" lang="ja">『キル・ビル』はこのアルバムの出発点。タイトルの由来であり、劇中の「修羅の花」とThe 5.6.7.8’sがチャンネル06と07のインスピレーションに。</p><p class="ar" dir="rtl" lang="ar">استعارت LAY-L تلك اللحظة عنوانًا للألبوم: تحيّةً للسينما، وإعلانًا عن الاتجاه. تذكرة الذهاب فقط تعني ألّا عودة إلى صوتٍ واحد. كلّ أغنية وجهةٌ جديدة، بعقدها ونوعها وقصّتها.</p><div class="folio"><span>ONE WAY · Issue 01</span><span>Feature</span><span class="pn">05</span></div></section></template><template><section class="pg dark"><img class="bleed" src="mag/x-crowd.webp" alt="" style="object-position:50% 50%"><div class="ph-shade"></div>
<div class="ph-tx"><div class="kick lt">The idea · コンセプト</div><h2 class="h1 lt">Japan,<br>as you’ve<br>lived it.</h2>
<p lang="ja" class="ja lt">映画、レコード、アニメ、おもちゃ。<br>私たちが本当に出会ってきた日本。</p></div><div class="folio dk"><span>ONE WAY · Issue 01</span><span>The idea</span><span class="pn">06</span></div></section></template><template><section class="pg"><div class="kick">Four ideas behind the album</div><div class="phg"><div class="phi"><span class="phn">01</span><h3>Japan, as you’ve experienced it</h3><div class="phj" lang="ja">体験としての日本</div><p class="body">This isn’t an album trying to sound “traditionally Japanese”. It’s Japan as most of us actually meet it: through films, records, anime, toys and late-night internet rabbit holes.</p><p class="ar sm" dir="rtl" lang="ar">ليس ألبومًا يحاول أن يبدو «يابانيًّا تقليديًّا»، بل اليابان كما يلتقيها معظمنا فعلًا: عبر الأفلام والأسطوانات والأنمي والألعاب وجولات الإنترنت في آخر الليل.</p></div><div class="phi"><span class="phn">02</span><h3>A run of imaginary soundtracks</h3><div class="phj" lang="ja">架空のサウンドトラック</div><p class="body">Each song is the soundtrack to a film that doesn’t exist. Different stories, different eras, one shared cinematic universe.</p><p class="ar sm" dir="rtl" lang="ar">كلّ أغنية موسيقى تصويرية لفيلمٍ غير موجود. قصصٌ مختلفة، وعصورٌ مختلفة، وعالمٌ سينمائيّ واحد.</p></div><div class="phi"><span class="phn">03</span><h3>Big feelings for small things</h3><div class="phj" lang="ja">小さなものへの大きな感情</div><p class="body">The narrators grieve what nobody else would: a recorded voice, a plastic flower, a half-heard song. The absurd is treated with complete sincerity.</p><p class="ar sm" dir="rtl" lang="ar">يحزن الرواة على ما لا يحزن عليه أحد: صوتٌ مسجَّل، وزهرةٌ بلاستيكية، وأغنيةٌ نصفُ مسموعة. ويُعامَل العبثيّ بصدقٍ كامل.</p></div><div class="phi"><span class="phn">04</span><h3>Freedom to move</h3><div class="phj" lang="ja">移動する自由</div><p class="body">The one-way ticket is permission to travel from 1960s garage rock to a Ghibli waltz without ever explaining yourself, and without going back.</p><p class="ar sm" dir="rtl" lang="ar">تذكرة الذهاب فقط إذنٌ بالسفر من روك الستينيات إلى فالس جيبلي دون تبريرٍ ودون عودة.</p></div></div><div class="folio"><span>ONE WAY · Issue 01</span><span>The idea</span><span class="pn">07</span></div></section></template><template><section class="pg"><div class="kick red">In-flight entertainment · 機内エンターテインメント</div><h2 class="h1">Now showing on all screens</h2>
<p class="body">Fourteen channels, one cinematic universe. Every song is the soundtrack to a film that doesn’t exist: tap a channel to read its programme notes, or press ▶ to play it on board.</p>
<p class="ar sm" dir="rtl" lang="ar">أربع عشرة قناة وعالمٌ سينمائيّ واحد. كلّ أغنية موسيقى تصويرية لفيلمٍ غير موجود: اختر قناة لقراءة ملاحظاتها، أو اضغط ▶ لتشغيلها.</p>

<div class="chbig">CH<b>01</b></div><h2 class="ptitle">One Missed Call.. Two…</h2><div class="pja" lang="ja">不在着信…2件…</div>
<img class="poster" src="mag/p-01.webp" alt="One Missed Call.. Two… poster">
<div class="chips"><span>Runtime 2:05</span><span>Now</span><span>Modern Japanese Hip-Hop</span></div>
<div class="tag"><span lang="ja">三度目は、ない。</span><em>There won’t be a third.</em><p class="tar" dir="rtl" lang="ar">لن تكون هناك ثالثة.</p></div>
<a class="play" href="./?play=0">▶ Play channel 01</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 01</span><span class="pn">10</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 01</div><div class="theme">Indifference, boundaries and the power of silence<span lang="ja">無関心、境界線、沈黙の力</span></div>
<blockquote class="pq">“Tick-tock, running late / You still don’t know how to play the game”<span lang="ja">チクタク、遅刻だね ／ まだゲームのやり方もわからないの</span></blockquote>
<p class="body drop">Someone keeps calling, convinced persistence will earn a reply. It won’t. As the missed calls pile up, a would-be confrontation turns into a gleeful display of indifference: the joy of refusing to take part in someone else’s drama.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>A hypnotic three-note shamisen riff over bass-heavy club rap, and a title that echoes Takashi Miike’s 2003 J-horror One Missed Call (着信アリ).</p></div>
<div class="two"><p class="ja sm" lang="ja">しつこく鳴り続ける電話。粘れば出てもらえると信じている相手。でも、出ない。不在着信が積み重なるほど、修羅場になるはずの展開は痛快な「無関心ショー」へ。他人のドラマに付き合わない快感の歌。</p><p class="ar sm" dir="rtl" lang="ar">شخصٌ ما يواصل الاتصال، مقتنعًا بأن الإلحاح سيجلب ردًّا. لن يحدث. ومع تراكم المكالمات الفائتة، تتحوّل المواجهة المحتملة إلى استعراضٍ مرحٍ للامبالاة، ومتعةِ رفض المشاركة في دراما الآخرين.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>One Missed Call.. Two…</span><span class="pn">11</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>02</b></div><h2 class="ptitle">Sakura</h2><div class="pja" lang="ja">桜</div>
<img class="poster" src="mag/p-02.webp" alt="Sakura poster">
<div class="chips"><span>Runtime 4:09</span><span>1990s</span><span>Late-90s Alt R&amp;B</span></div>
<div class="tag"><span lang="ja">朝になれば、いない人。</span><em>Someone who’s gone by morning.</em><p class="tar" dir="rtl" lang="ar">شخصٌ يرحل مع الصباح.</p></div>
<a class="play" href="./?play=1">▶ Play channel 02</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 02</span><span class="pn">12</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 02</div><div class="theme">Temporary intimacy and nostalgia for ordinary moments<span lang="ja">束の間の親密さと、ありふれた瞬間への郷愁</span></div>
<blockquote class="pq">“Cold rice and tempura / You were talking through the morning”<span lang="ja">冷めたご飯と天ぷら ／ 朝まで話し続けたあなた</span></blockquote>
<p class="body drop">Someone keeps turning up, making themselves at home, then leaving without a word. She knows they’re unreliable, yet what she misses isn’t the relationship. It’s the small things: sitting on the floor, cold rice and tempura, talking about nothing until morning.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Sakura (桜), the cherry blossom and Japan’s best-known symbol, plus tempura and everyday intimacy, set to late-90s neo-soul.</p></div>
<div class="two"><p class="ja sm" lang="ja">ふらっと現れては居座り、何も言わずに去っていく人。頼りにならないのはわかっている。それでも恋しいのは関係そのものではなく、床に座って、冷めたご飯と天ぷら、朝まで他愛もない話をした時間。</p><p class="ar sm" dir="rtl" lang="ar">شخصٌ يظهر مرّةً بعد أخرى، يتصرّف وكأنه في بيته، ثم يرحل بلا كلمة. تعرف أنه لا يُعتمَد عليه، لكن ما تفتقده ليس العلاقة، بل التفاصيل الصغيرة: الجلوس على الأرض، رزٌّ بارد وتمبورا، والحديث عن لا شيء حتى الصباح.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Sakura</span><span class="pn">13</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>03</b></div><h2 class="ptitle">Lost in Japan</h2><div class="pja" lang="ja">日本で迷子</div>
<img class="poster" src="mag/p-03.webp" alt="Lost in Japan poster">
<div class="chips"><span>Runtime 3:26</span><span>Y2K</span><span>90s Gospel-R&amp;B</span></div>
<div class="tag"><span lang="ja">迷子で、いい。</span><em>It’s fine to be lost.</em><p class="tar" dir="rtl" lang="ar">لا بأس أن أضيع.</p></div>
<a class="play" href="./?play=2">▶ Play channel 03</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 03</span><span class="pn">14</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 03</div><div class="theme">Travel, and familiar feelings in unfamiliar places<span lang="ja">旅と、見知らぬ場所で出会う懐かしい感情</span></div>
<blockquote class="pq">“Funny how a city you’ve never seen / Can feel familiar on the first night”<span lang="ja">不思議ね、見たこともない街が ／ 最初の夜から懐かしいなんて</span></blockquote>
<p class="body drop">A trip through Japan turns unexpectedly emotional. Matcha from a vending machine, the wrong train, a paper fortune carried off by the breeze: every new detail brings back someone who isn’t there. Hushed verses burst into huge gospel choruses.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>The album’s most explicit link to Japan: Shibuya, train stations and vending machines, with a harmonising shamisen beneath the choir.</p></div>
<div class="two"><p class="ja sm" lang="ja">日本を旅するうちに、思いがけず心が揺れる。自販機の抹茶、乗り間違えた電車、風に飛ばされたおみくじ。新しい景色のひとつひとつが、ここにいない誰かを連れてくる。ささやくようなヴァースが、壮大なゴスペル・コーラスへと弾ける。</p><p class="ar sm" dir="rtl" lang="ar">رحلةٌ عبر اليابان تصبح عاطفيةً على نحوٍ غير متوقَّع. ماتشا من آلة بيع، وقطارٌ خاطئ، وورقةُ حظٍّ يحملها النسيم بعيدًا، وكلُّ تفصيلٍ جديد يستحضر شخصًا غائبًا. مقاطع هامسة تنفجر في جوقات غوسبل هائلة.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Lost in Japan</span><span class="pn">15</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>04</b></div><h2 class="ptitle">Why Would I?</h2><div class="pja" lang="ja">なぜ、私が？</div>
<img class="poster" src="mag/p-04.webp" alt="Why Would I? poster">
<div class="chips"><span>Runtime 5:05</span><span>1979</span><span>1970s Japanese City Pop</span></div>
<div class="tag"><span lang="ja">直せる。でも、なぜ？</span><em>I could fix it. But why?</em><p class="tar" dir="rtl" lang="ar">أستطيع إصلاحه. لكن لماذا؟</p></div>
<a class="play" href="./?play=3">▶ Play channel 04</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 04</span><span class="pn">16</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 04</div><div class="theme">Self-respect and personal choice<span lang="ja">自尊心と、自分で選ぶこと</span></div>
<blockquote class="pq">“There’s a little difference / Between what I can and what I choose”<span lang="ja">ちょっとした違いがあるの ／ 「できること」と「選ぶこと」の間には</span></blockquote>
<p class="body drop">She could fix it. She could compromise, try again, make it work. Instead she asks a simpler question: why would I? No confrontation and no tears, just a disco groove and the easy confidence of choosing not to.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Rooted in the golden age of Japanese city pop, the era of Miki Matsubara’s 1979 classic Mayonaka no Door (Stay With Me).</p></div>
<div class="two"><p class="ja sm" lang="ja">直そうと思えば直せる。妥協も、やり直しもできる。でも彼女はもっとシンプルに問う――なぜ、私が？　修羅場も涙もない。ディスコのグルーヴと、「しない」を選ぶ軽やかな自信だけ。</p><p class="ar sm" dir="rtl" lang="ar">تستطيع إصلاح الأمر، والتنازل، والمحاولة من جديد. لكنها تطرح سؤالًا أبسط: ولماذا قد أفعل؟ لا مواجهة ولا دموع، بل إيقاعُ ديسكو وثقةٌ هادئة في اختيار ألّا تفعل.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Why Would I?</span><span class="pn">17</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>06</b></div><h2 class="ptitle">The Voice at Platform Two</h2><div class="pja" lang="ja">二番線の声</div>
<img class="poster" src="mag/p-06.webp" alt="The Voice at Platform Two poster">
<div class="chips"><span>Runtime 4:44</span><span>1973</span><span>1970s Enka</span></div>
<div class="tag"><span lang="ja">今も、黄色い線の内側に。</span><em>Still standing behind the yellow line.</em><p class="tar" dir="rtl" lang="ar">ما زلتُ خلف الخطّ الأصفر.</p></div>
<a class="play" href="./?play=4">▶ Play channel 06</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 06</span><span class="pn">18</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 06</div><div class="theme">Attachment to the familiar, and unexpected grief<span lang="ja">慣れ親しんだものへの愛着と、思いがけない喪失</span></div>
<blockquote class="pq">“I watched a woman disappear / Who’d never lived at all”<span lang="ja">消えていく女を見た ／ 一度も生きていなかった女を</span></blockquote>
<p class="body drop">Every morning the same recorded voice asks passengers to stand behind the yellow line. One Tuesday it’s replaced. The trains still run on time and nobody notices, except her. A routine software update becomes a quiet, genuine tragedy.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Inspired by Meiko Kaji’s Shura no Hana, theme of the 1973 film Lady Snowblood, later used by Tarantino in Kill Bill: Vol. 1.</p></div>
<div class="two"><p class="ja sm" lang="ja">毎朝、同じ録音の声が「黄色い線の内側までお下がりください」と告げる。ある火曜日、その声が差し替えられた。電車は時刻通り、誰も気づかない――彼女以外は。ありふれたアップデートが、静かで本物の悲劇になる。</p><p class="ar sm" dir="rtl" lang="ar">كلَّ صباح، يطلب الصوتُ المسجَّل نفسُه من الركّاب الوقوفَ خلف الخطّ الأصفر. وذات ثلاثاء، يُستبدَل. تبقى القطارات في مواعيدها ولا يلاحظ أحد، إلّاها. تحديثٌ تقنيٌّ عاديّ يصبح مأساةً هادئةً وحقيقية.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>The Voice at Platform Two</span><span class="pn">19</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>07</b></div><h2 class="ptitle">Plastic Flower</h2><div class="pja" lang="ja">プラスチック・フラワー</div>
<img class="poster" src="mag/p-07.webp" alt="Plastic Flower poster">
<div class="chips"><span>Runtime 3:12</span><span>1960s</span><span>1960s Japanese Garage Rock</span></div>
<div class="tag"><span lang="ja">犯人は、ウェイトレス。</span><em>The culprit: the waitress.</em><p class="tar" dir="rtl" lang="ar">الجانية: النادلة.</p></div>
<a class="play" href="./?play=5">▶ Play channel 07</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 07</span><span class="pn">20</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 07</div><div class="theme">The value of “worthless” things<span lang="ja">「価値のないもの」の価値</span></div>
<blockquote class="pq">“Who gave you permission to die? / You weren’t even alive!”<span lang="ja">誰が死んでいいって言ったの？ ／ 生きてもいなかったくせに！</span></blockquote>
<p class="body drop">A waitress throws away her favourite fake rose. Everyone says it’s replaceable; it was never alive. She buys an identical one, but it stands up much too straight. A trivial loss blown up into a shouted, fuzz-drenched catastrophe.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Channels The 5.6.7.8’s, the Tokyo garage-rock band who play the House of Blue Leaves scene in Kill Bill: Vol. 1.</p></div>
<div class="two"><p class="ja sm" lang="ja">お気に入りの造花のバラを、ウェイトレスが捨ててしまった。「代わりはある、生きてもいないんだから」とみんなは言う。同じものを買っても、まっすぐ立ちすぎている。小さな喪失が、ファズまみれの大惨事に。</p><p class="ar sm" dir="rtl" lang="ar">نادلةٌ ترمي وردتها البلاستيكية المفضّلة. الجميع يقول إنها قابلةٌ للاستبدال، فهي لم تكن حيّةً أصلًا. تشتري واحدةً مطابقة، لكنها تقف مستقيمةً أكثر من اللازم. خسارةٌ تافهة تتضخّم إلى كارثةٍ صاخبة.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Plastic Flower</span><span class="pn">21</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>08</b></div><h2 class="ptitle">Crickets</h2><div class="pja" lang="ja">コオロギ</div>
<img class="poster" src="mag/p-08.webp" alt="Crickets poster">
<div class="chips"><span>Runtime 3:03</span></div>
<div class="tag"><span lang="ja">誰も、来なかった。</span><em>Nobody came.</em><p class="tar" dir="rtl" lang="ar">لم يأتِ أحد.</p></div>
<a class="play" href="./?play=6">▶ Play channel 08</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 08</span><span class="pn">22</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 08</div><div class="theme">Silence, effort and one-sided friendship<span lang="ja">沈黙、努力、一方通行の友情</span></div>
<blockquote class="pq">“I thought we were losing touch / Turns out I was the touch”<span lang="ja">距離ができたと思ってた ／ つながりは、私だけだった</span></blockquote>
<p class="body drop">She was always the first call and the last to leave. So she went quiet, just to see who would come looking. Nobody did. Crickets is the sound of a one-sided friendship exposed by its own silence, and the strange relief of no longer carrying it alone.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>In Japan, the song of autumn insects is something people stop to listen to. Crickets were once kept in small bamboo cages for their voices. Here, that voice is the only one that answers.</p></div>
<div class="two"><p class="ja sm" lang="ja">いつも最初に電話して、最後まで残るのは彼女だった。だから一度だけ黙ってみた。誰が探しに来るのかを確かめるために。誰も来なかった。一方通行の友情が自らの沈黙で露わになる歌。そして、もう一人で背負わなくていいという不思議な安堵の歌。</p><p class="ar sm" dir="rtl" lang="ar">كانت دائمًا أوّل من يتّصل وآخر من يغادر. فقرّرت أن تصمت، فقط لترى من سيأتي ليبحث عنها. لم يأتِ أحد. «صراصير الليل» صوتُ صداقةٍ من طرفٍ واحد يفضحها صمتها، والارتياح الغريب حين لا يعود عليك أن تحملها وحدك.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Crickets</span><span class="pn">23</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>09</b></div><h2 class="ptitle">SAdTURN</h2><div class="pja" lang="ja">土星</div>
<img class="poster" src="mag/p-09.webp" alt="SAdTURN poster">
<div class="chips"><span>Runtime 4:04</span></div>
<div class="tag"><span lang="ja">また、同じ傷へ。</span><em>Back to the same wound.</em><p class="tar" dir="rtl" lang="ar">عودةٌ إلى الجرح نفسه.</p></div>
<a class="play" href="./?play=7">▶ Play channel 09</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 09</span><span class="pn">24</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 09</div><div class="theme">Patterns, nostalgia and the comfort of sadness<span lang="ja">繰り返し、ノスタルジー、悲しみの心地よさ</span></div>
<blockquote class="pq">“Must be a pattern / Return to Saturn, return to sad-turn”<span lang="ja">きっと、いつものパターン ／ 土星へ還る、悲しみへ還る</span></blockquote>
<p class="body drop">Some people always reach for the songs that bruise: the minor keys, the endings they already know by heart. SAdTURN is about that loop, choosing the familiar ache over peace, and the question underneath it all: when will you learn?</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>The title folds three meanings into one word: sadness, the astrological “Saturn return”, and a nod to the 1990s Japanese game console that shared the planet’s name. The cover’s CONTINUE? screen asks the song’s question in arcade language.</p></div>
<div class="two"><p class="ja sm" lang="ja">傷つく歌ばかり選んでしまう人がいる。短調、結末を知り尽くした曲。SAdTURNは、その繰り返しの歌。安らぎより馴染みの痛みを選ぶこと。そしてその下にある問い――いつになったら学ぶの？</p><p class="ar sm" dir="rtl" lang="ar">هناك من يختار دائمًا الأغاني التي تجرح: السلالم الحزينة، والنهايات التي يحفظها عن ظهر قلب. «SAdTURN» عن هذه الدائرة: اختيارِ الألم المألوف بدل السلام، والسؤالِ الكامن تحتها: متى ستتعلّم؟</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>SAdTURN</span><span class="pn">25</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>10</b></div><h2 class="ptitle">ASMR Stimulation</h2><div class="pja" lang="ja">ASMR・スティミュレーション</div>
<img class="poster" src="mag/p-10.webp" alt="ASMR Stimulation poster">
<div class="chips"><span>Runtime 3:21</span><span>Now</span><span>Dark Electro-Funk</span></div>
<div class="tag"><span lang="ja">急がないで。</span><em>Don’t hurry.</em><p class="tar" dir="rtl" lang="ar">لا تستعجل.</p></div>
<a class="play" href="./?play=8">▶ Play channel 10</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 10</span><span class="pn">26</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 10</div><div class="theme">Auditory pleasure and the seduction of anticipation<span lang="ja">聴く快楽と、焦らしの誘惑</span></div>
<blockquote class="pq">“Don’t get to the point / I prefer the scenic route”<span lang="ja">本題に入らないで ／ 遠回りのほうが好きなの</span></blockquote>
<p class="body drop">An ordinary conversation becomes a seduction. Pauses, breaths, pronunciation and polite bureaucratic phrases take on double meanings, and the whole game is in the waiting. Clicks, whispers and binaural stereo make the sound itself the object of desire.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Drawn from Japan’s deep ASMR culture: mimikaki (耳かき), binaural recording and intimate “situation voice” (シチュエーションボイス) performances.</p></div>
<div class="two"><p class="ja sm" lang="ja">ありふれた会話が誘惑に変わる。間、息づかい、発音、丁寧すぎる事務的な言い回しが二重の意味を帯び、駆け引きは「待つこと」そのもの。クリック音、ささやき、バイノーラル音響が、音そのものを欲望の対象にする。</p><p class="ar sm" dir="rtl" lang="ar">محادثةٌ عادية تتحوّل إلى إغواء. الوقفات والأنفاس والنطق والعبارات الرسمية المهذّبة تكتسب معانيَ مزدوجة، واللعبة كلّها في الانتظار. نقراتٌ وهمساتٌ وصوتٌ مجسَّم تجعل الصوتَ نفسَه موضعَ الرغبة.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>ASMR Stimulation</span><span class="pn">27</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>11</b></div><h2 class="ptitle">Refrigerator</h2><div class="pja" lang="ja">冷蔵庫</div>
<img class="poster" src="mag/p-11.webp" alt="Refrigerator poster">
<div class="chips"><span>Runtime 3:03</span></div>
<div class="tag"><span lang="ja">英語、むずかしい。</span><em>English is hard.</em><p class="tar" dir="rtl" lang="ar">الإنجليزية صعبة.</p></div>
<a class="play" href="./?play=9">▶ Play channel 11</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 11</span><span class="pn">28</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 11</div><div class="theme">Jealousy, language and attitude<span lang="ja">嫉妬、ことば、アティチュード</span></div>
<blockquote class="pq">“You like winter, cold like refrigerator / My bag is alligator”<span lang="ja">冬が好きなあなた、冷蔵庫みたいに冷たい ／ 私のバッグはアリゲーター</span></blockquote>
<p class="body drop">A jealous girlfriend, a cold boyfriend, and not quite enough English to say everything she feels, so she says it anyway. Refrigerator turns broken grammar into pure attitude: absurd, bouncy and completely sincere.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Anyone who learned English in Japan knows the flashcard: a picture, a word, and the katakana underneath to help you say it. リフリジレーター is a mouthful in any language, and the cover marks it wrong, with love.</p></div>
<div class="two"><p class="ja sm" lang="ja">嫉妬する彼女と、冷たい彼氏。気持ちを全部言うには英語が少し足りない。それでも彼女は言い切る。崩れた文法をそのままアティチュードに変える歌。不条理で、弾けていて、どこまでも本気。</p><p class="ar sm" dir="rtl" lang="ar">حبيبةٌ غيور، وحبيبٌ بارد، وإنجليزيةٌ لا تكفي تمامًا لقول كل ما تشعر به، فتقوله على أي حال. «الثلاجة» تحوّل القواعد المكسورة إلى موقفٍ خالص: عبثية، مرحة، وصادقة تمامًا.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Refrigerator</span><span class="pn">29</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>12</b></div><h2 class="ptitle">The Wind Called In Sick</h2><div class="pja" lang="ja">風が病欠した日</div>
<img class="poster" src="mag/p-12.webp" alt="The Wind Called In Sick poster">
<div class="chips"><span>Runtime 3:09</span><span>2004</span><span>Japanese Romantic Waltz</span></div>
<div class="tag"><span lang="ja">最後の一行が、思い出せない。</span><em>I can’t remember the last line.</em><p class="tar" dir="rtl" lang="ar">لا أتذكّر السطر الأخير.</p></div>
<a class="play" href="./?play=10">▶ Play channel 12</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 12</span><span class="pn">30</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 12</div><div class="theme">Memory, impermanence and unfinished things<span lang="ja">記憶、無常、未完成の美</span></div>
<blockquote class="pq">“It comes to me in pieces / And leaves before it ends”<span lang="ja">かけらになってやって来て ／ 終わる前に去っていく</span></blockquote>
<p class="body drop">One afternoon the wind simply stops. In the stillness, a woman sings from an upstairs window and never reaches the last line. The melody stays half-remembered until, walking home, she sings the ending wrong. A small waltz about memory and the beauty of unfinished things.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Inspired by Joe Hisaishi’s Merry-Go-Round of Life from Studio Ghibli’s Howl’s Moving Castle.</p></div>
<div class="two"><p class="ja sm" lang="ja">ある午後、風がぴたりと止んだ。静けさの中、二階の窓から女の歌声が聞こえ、最後の一行に届かないまま途切れる。半分だけ覚えたメロディーを、帰り道、違う結末で歌ってしまう。記憶と、未完成なものの美しさをめぐる小さなワルツ。</p><p class="ar sm" dir="rtl" lang="ar">ذات ظهيرة، تتوقّف الريح ببساطة. في السكون، تغنّي امرأةٌ من نافذةٍ علوية ولا تصل أبدًا إلى السطر الأخير. يبقى اللحن نصفَ متذكَّر، حتى تغنّي نهايته خطأً في طريق العودة. فالسٌ صغير عن الذاكرة وجمال الأشياء غير المكتملة.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>The Wind Called In Sick</span><span class="pn">31</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>13</b></div><h2 class="ptitle">Tamagotchi Luv</h2><div class="pja" lang="ja">たまごっち・ラヴ</div>
<img class="poster" src="mag/p-13.webp" alt="Tamagotchi Luv poster">
<div class="chips"><span>Runtime 4:07</span><span>1996</span><span>Dark R&amp;B</span><span class="rd">Bonus flight</span></div>
<div class="tag"><span lang="ja">それは、愛なのか——？</span><em>Is that love—?</em><p class="tar" dir="rtl" lang="ar">هل هذا حبّ——؟</p></div>
<a class="play" href="./?play=11">▶ Play channel 13</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 13</span><span class="pn">32</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 13</div><div class="theme">Conditional affection and the need to be needed<span lang="ja">条件付きの愛情と、必要とされたい欲求</span></div>
<blockquote class="pq">“You call it love but it’s luv with a u / You can’t call it love when it’s only you”<span lang="ja">それを愛と呼ぶけど、綴りがひとつ違う ／ あなただけなら、愛とは呼べない</span></blockquote>
<p class="body drop">Love as a virtual pet: fed when it’s convenient, ignored when it isn’t, kept alive at a distance. A 90s toy’s innocence against the control games of adult relationships, and the question of whether you care for someone or just like being needed.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Built on Tamagotchi, the virtual pet Bandai launched in Japan in November 1996.</p></div>
<div class="two"><p class="ja sm" lang="ja">恋はバーチャルペット。都合のいい時だけ世話をして、そうでなければ放っておく。距離を置いたまま生かしておく。90年代のおもちゃの無邪気さと、大人の恋の支配ゲーム。その人を大切にしているのか、必要とされるのが好きなだけなのか。</p><p class="ar sm" dir="rtl" lang="ar">الحبّ كحيوانٍ أليفٍ افتراضي: يُطعَم حين يكون ذلك مريحًا، ويُهمَل حين لا يكون، ويبقى حيًّا عن بُعد. براءةُ لعبةٍ من التسعينيات في مواجهة ألعاب السيطرة في علاقات الكبار، والسؤال: هل تهتمّ بشخصٍ ما، أم تحبّ فقط أن يحتاجك؟</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Tamagotchi Luv</span><span class="pn">33</span></div></section></template><template><section class="pg dark prog"><div class="pt"><span>In-flight entertainment · 機内エンターテインメント</span><span>Now showing</span></div>
<div class="chbig">CH<b>14</b></div><h2 class="ptitle">Voodoo Doll</h2><div class="pja" lang="ja">藁人形</div>
<img class="poster" src="mag/p-14.webp" alt="Voodoo Doll poster">
<div class="chips"><span>Runtime 4:14</span><span class="rd">Bonus flight</span></div>
<div class="tag"><span lang="ja">呪われたのは、誰？</span><em>Who’s the cursed one?</em><p class="tar" dir="rtl" lang="ar">من الملعون حقًّا؟</p></div>
<a class="play" href="./?play=12">▶ Play channel 14</a><div class="folio dk"><span>ONE WAY · Issue 01</span><span>Channel 14</span><span class="pn">34</span></div></section></template><template><section class="pg"><div class="kick">Programme notes · CH 14</div><div class="theme">Revenge, theatre and a wink<span lang="ja">復讐、芝居、ウインク</span></div>
<blockquote class="pq">“Hocus pocus, can’t you see? / The only disappearing act is you leaving me”<span lang="ja">ホーカス・ポーカス、わからない？ ／ 消える手品は、あなたが去ることだけ</span></blockquote>
<p class="body drop">He cheated; she’s a witch. Voodoo Doll is a theatrical revenge spell with a wink: the purse goes to a friend, the pin goes in the doll, and the only disappearing act left is him leaving.</p>
<div class="jbox"><b>The Japan connection · 日本とのつながり</b><p>Japan has its own curse doll: the wara ningyō, a straw figure nailed to a shrine tree at the hour of the ox, between 1 and 3 a.m. On the cover it wears a striped necktie, so there is no doubt who it is for.</p></div>
<div class="two"><p class="ja sm" lang="ja">彼は浮気した。彼女は魔女だった。ウインク付きの、芝居がかった復讐の呪文。バッグは友だちに預けて、ピンは人形へ。残る消える手品は、彼が去ることだけ。</p><p class="ar sm" dir="rtl" lang="ar">خانها، وهي ساحرة. «دمية الفودو» تعويذةُ انتقامٍ مسرحية بغمزة: الحقيبة تذهب إلى صديقة، والدبوس إلى الدمية، ولا يبقى من فقرة الإخفاء إلا رحيله هو.</p></div><div class="folio"><span>ONE WAY · Issue 01</span><span>Voodoo Doll</span><span class="pn">35</span></div></section></template><template><section class="pg"><div class="kick">Arrival · 到着</div><h2 class="h1">Thank you for flying LAY-L AIR</h2>
<p class="body">This has been a one-way flight. Keep this magazine, keep your seat, or keep listening: every channel stays open on the album page, with synced lyrics on board.</p>
<p class="ja" lang="ja">片道フライトへのご搭乗、ありがとうございました。このマガジンはお持ち帰りいただけます。</p>

<div class="bk"><img src="../brand/layl-logo-cream.svg" alt="LAY-L"><span>Okinawa… One Way…</span><span lang="ja">沖縄…片道…</span><small>ONE WAY · The in-flight magazine of LAY-L AIR · Issue 01 · Please take this copy with you</small></div></section></template><script>
(function(){
  var tpls=[].slice.call(document.querySelectorAll("template")), N=tpls.length;
  var V=[[null,0]]; for(var i=1;i<N-1;i+=2) V.push([i,i+1<N-1?i+1:null]); V.push([N-1,null]);
  var stage=document.getElementById("stage"), book=document.createElement("div"); book.className="book"; stage.appendChild(book);
  var L=document.createElement("div"),R=document.createElement("div"),sp=document.createElement("div");
  L.className="slot l";R.className="slot r";sp.className="spine";book.appendChild(L);book.appendChild(R);book.appendChild(sp);
  function page(i){ if(i===null) return null; var d=document.createElement("div"); d.appendChild(tpls[i].content.cloneNode(true)); return d.firstElementChild; }
  function fill(slot,i){ slot.innerHTML=""; var e=page(i); if(e) slot.appendChild(e); }
  var cur=0, busy=false;
  function size(){ var r=stage.getBoundingClientRect(), pad=innerWidth<700?6:76, s=Math.min((r.width-pad*2)/1200,(r.height-12)/800);
    book.style.transform="scale("+s+") translate(-600px,-400px)"; }
  function pad2(n){return (n<10?"0":"")+n;}
  function status(){ var v=V[cur], a=v.filter(function(x){return typeof x==="number";}); var f=a[0]+1, l=a[a.length-1]+1;
    document.getElementById("pc").textContent=(f==l?pad2(f):pad2(f)+"–"+pad2(l))+" / "+pad2(N);
    document.getElementById("bar").style.width=(100*l/N)+"%";
    sp.style.display=(v[0]===null||v[1]===null)?"none":"";
    document.getElementById("prev").disabled=cur==0; document.getElementById("next").disabled=cur==V.length-1;
    try{history.replaceState(null,"","#p"+f);}catch(e){} }
  function show(){ fill(L,V[cur][0]); fill(R,V[cur][1]); status(); }
  function go(p){ for(var q=0;q<V.length;q++) if(V[q].indexOf(p)>=0){ cur=q; show(); return; } }
  function flip(dir){
    if(busy) return; var k=cur+dir; if(k<0||k>=V.length) return; busy=true;
    var A=V[cur], Bv=V[k], leaf=document.createElement("div"), fr=document.createElement("div"), bk=document.createElement("div");
    fr.className="face f"; bk.className="face b";
    var f1=page(dir>0?A[1]:A[0]), f2=page(dir>0?Bv[0]:Bv[1]); if(f1) fr.appendChild(f1); if(f2) bk.appendChild(f2);
    leaf.className="leaf "+(dir>0?"r":"l"); leaf.appendChild(fr); leaf.appendChild(bk); book.appendChild(leaf);
    if(dir>0) fill(R,Bv[1]); else fill(L,Bv[0]);
    sp.style.display="";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ leaf.style.transform="rotateY("+(dir>0?-180:180)+"deg)"; }); });
    setTimeout(function(){ cur=k; if(dir>0) fill(L,Bv[0]); else fill(R,Bv[1]); leaf.remove(); status(); busy=false; }, 780);
  }
  document.getElementById("prev").onclick=function(){flip(-1);};
  document.getElementById("next").onclick=function(){flip(1);};
  addEventListener("keydown",function(e){ if(e.key=="ArrowRight") flip(1); if(e.key=="ArrowLeft") flip(-1); });
  stage.addEventListener("click",function(e){ if(e.target.closest("a")) return; var ti=e.target.closest(".ti"); if(!ti||busy) return;
    var n=parseInt((ti.querySelector(".n")||{}).textContent,10); if(n) go(n-1); });
  addEventListener("resize",size);
  var m=/#p(\d+)/.exec(location.hash); if(m){ var p=+m[1]-1; for(var q=0;q<V.length;q++) if(V[q].indexOf(p)>=0){cur=q;break;} }
  size(); show();
})();
</script></body></html>
