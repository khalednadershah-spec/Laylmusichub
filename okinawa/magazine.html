<div class="box" style="left:4.5%;top:71%;width:91%;height:21%"><p class="lede s">Okinawa… One Way.. is a journey through Japan as seen through film, music and pop culture: a run of imaginary film soundtracks, each from a different decade and genre, all sharing one cinematic universe.</p>
<p class="jbody s" lang="ja">『沖縄…片道…』は、映画・音楽・ポップカルチャーを通して見た日本を旅するアルバム。年代もジャンルも異なる「架空の映画のサウンドトラック」たちが、ひとつのシネマティックな世界を共有する。</p><div class="sign s">— LAY-L, your crew tonight</div></div></section></template><template><section class="pg art fit"><img class="fitimg" src="mag/x-album.webp" alt="Okinawa… One Way..: about the album. 14 channels, 2 bonus tracks, 1 one-way ticket."><div class="vh"><p>From 1960s garage rock and 1970s enka to city-pop disco, 90s R&amp;B, modern Japanese hip-hop and a Ghibli-style waltz, the songs follow fleeting relationships, strange attachments and ordinary things that turn out to matter. Some stories are absurd, some intimate, some provocative, and every one is sung with complete sincerity.</p></div></section></template><template><section class="pg art fit"><img class="fitimg" src="mag/x-why.webp" alt="Why one way? A hand holds a one-way ticket to Okinawa beside a LAY-L AIR tail fin."><div class="vh"><p>In Quentin Tarantino’s Kill Bill: Vol. 1, The Bride walks up to an airline counter and asks for a one-way ticket to Okinawa. She isn’t planning to come back the same person.</p><p>LAY-L borrowed that moment for the album’s title: a tribute to cinema, and a statement of direction. A one-way ticket means no return trip to a single sound. Every song is a new destination, with its own decade, genre and story.</p><p>Kill Bill runs through the whole record: the title comes from it, Shura no Hana (channel 06) plays in it, and The 5.6.7.8’s (channel 07) perform in it.</p></div></section></template><template><section class="pg art fit"><img class="fitimg" src="mag/x-idea.webp" alt="The idea: four principles behind the album, under a sky of summer clouds."><div class="vh"><h3>Japan, as you’ve experienced it</h3><p>This isn’t an album trying to sound “traditionally Japanese”. It’s Japan as most of us actually meet it: through films, records, anime, toys and late-night internet rabbit holes.</p><h3>A run of imaginary soundtracks</h3><p>Each song is the soundtrack to a film that doesn’t exist. Different stories, different eras, one shared cinematic universe.</p><h3>Big feelings for small things</h3><p>The narrators grieve what nobody else would: a recorded voice, a plastic flower, a half-heard song. The absurd is treated with complete sincerity.</p><h3>Freedom to move</h3><p>The one-way ticket is permission to travel from 1960s garage rock to a Ghibli waltz without ever explaining yourself, and without going back.</p></div></section></template><template><section class="pg art fit"><img class="fitimg" src="mag/x-meet2.webp" alt="Meet LAY-L: Lilac on vocals, Asmar on guitar and vocals, Yamm on bass and reggae vocals, Lattam on drums"><div class="vh">Cabin crew, vocals: Lilac. Captain, guitar and vocals: Asmar. In-flight chef, bass and reggae vocals: Yamm. Safety demonstration, drums: Lattam. Different rhythms, one journey. That’s LAY-L.</div></section></template><template><section class="pg ife-pg"><div class="mast"><div class="mw"><span class="speed"><i></i><i></i><i></i></span><b>LAY-L AIR</b></div>

<div class="opts"><span>AUDIO OPTIONS <em lang="ja">音声</em></span><span><i class="on"></i>STEREO</span><span>SUBTITLES <em lang="ja">字幕</em></span><span><i class="on"></i>SYNCED LYRICS</span></div><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>08</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 01</div><div class="rule2"></div><img class="post" src="mag/p-01.webp" alt="One Missed Call.. Two… poster"><div class="info"><div><p class="tja" lang="ja">三度目は、ない。</p><p class="ten">There won’t be a third.</p></div><dl><dt>GENRE</dt><dd>Modern Japanese Hip-Hop / Club Rap</dd><dt>RUNTIME</dt><dd>02:04</dd><dt>RATING</dt><dd><span class="rate">18+</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-01.webp" alt="" loading="lazy"><div class="theme">Indifference, boundaries and the power of silence</div><blockquote class="q">“Tick-tock, running late / You still don’t know how to play the game”</blockquote><p class="syn">Someone keeps calling, convinced persistence will earn a reply. It won’t. As the missed calls pile up, a would-be confrontation turns into a gleeful display of indifference: the joy of refusing to take part in someone else’s drama.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>A hypnotic three-note shamisen riff over bass-heavy club rap, and a title that echoes Takashi Miike’s 2003 J-horror One Missed Call (着信アリ).</p><a class="play" href="./?play=0"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 01 · 2:04</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>09</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 02</div><div class="rule2"></div><img class="post" src="mag/p-02.webp" alt="Sakura poster"><div class="info"><div><p class="tja" lang="ja">朝になれば、<br>いない人。</p><p class="ten">Someone who’s gone by morning.</p></div><dl><dt>GENRE</dt><dd>Late-90s Alt R&amp;B / Neo-Soul</dd><dt>RUNTIME</dt><dd>04:09</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-02.webp" alt="" loading="lazy"><div class="theme">Temporary intimacy and nostalgia for ordinary moments</div><blockquote class="q">“Cold rice and tempura / You were talking through the morning”</blockquote><p class="syn">Someone keeps turning up, making themselves at home, then leaving without a word. She knows they’re unreliable, yet what she misses isn’t the relationship. It’s the small things: sitting on the floor, cold rice and tempura, talking about nothing until morning.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Sakura (桜), the cherry blossom and Japan’s best-known symbol, plus tempura and everyday intimacy, set to late-90s neo-soul.</p><a class="play" href="./?play=1"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 02 · 4:09</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>10</b></div></section></template><template><section class="pg chp v-wide"><div class="chtag">LAY-L AIR<br>CHANNEL 03</div><div class="rule2"></div><div class="wideimg"><img class="post" src="mag/p-03.webp" alt="Lost in Japan poster"><div class="ontag"><div><p class="tja" lang="ja">迷子で、いい。</p><p class="ten">It’s fine to be lost.</p></div></div></div><div class="strip"><dl><dt>GENRE</dt><dd>90s Gospel-R&amp;B / Y2K Alt Pop</dd><dt>RUNTIME</dt><dd>03:25</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><img class="badge" src="mag/i-03.webp" alt="" loading="lazy"><div class="theme">Travel, and familiar feelings in unfamiliar places</div><blockquote class="q">“Funny how a city you’ve never seen / Can feel familiar on the first night”</blockquote><p class="syn">A trip through Japan turns unexpectedly emotional. Matcha from a vending machine, the wrong train, a paper fortune carried off by the breeze: every new detail brings back someone who isn’t there. Hushed verses burst into huge gospel choruses.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>The album’s most explicit link to Japan: Shibuya, train stations and vending machines, with a harmonising shamisen beneath the choir.</p><a class="play" href="./?play=2"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 03 · 3:25</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>11</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 04</div><div class="rule2"></div><img class="post" src="mag/p-04.webp" alt="Why Would I? poster"><div class="info"><div><p class="tja" lang="ja">直せる。でも、<br>なぜ？</p><p class="ten">I could fix it. But why?</p></div><dl><dt>GENRE</dt><dd>1970s Japanese City Pop / Disco</dd><dt>RUNTIME</dt><dd>03:43</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-04.webp" alt="" loading="lazy"><div class="theme">Self-respect and personal choice</div><blockquote class="q">“There’s a little difference / Between what I can and what I choose”</blockquote><p class="syn">She could fix it. She could compromise, try again, make it work. Instead she asks a simpler question: why would I? No confrontation and no tears, just a disco groove and the easy confidence of choosing not to.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Rooted in the golden age of Japanese city pop, the era of Miki Matsubara’s 1979 classic Mayonaka no Door (Stay With Me).</p><a class="play" href="./?play=3"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 04 · 3:43</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>12</b></div></section></template><template><section class="pg chp v-quote"><div class="chtag">LAY-L AIR<br>CHANNEL 05</div><div class="rule2"></div><div class="theme">Hypocrisy, convenience and getting with the times</div><blockquote class="q">“It can’t steal a soul that was never supplied / The vision is human the machine just replies”</blockquote><div class="qrow"><img class="post" src="mag/p-05.webp" alt="Auntie A.I. poster"><div><div><p class="tja" lang="ja">アンティーは、<br>まだ止まったまま。</p><p class="ten">Auntie is still stuck in time.</p></div><dl><dt>GENRE</dt><dd>Japanese Electro Dark New Wave / Y2K Dance-Rock</dd><dt>RUNTIME</dt><dd>04:04</dd><dt>RATING</dt><dd><span class="rate">18+</span></dd></dl></div></div><img class="badge" src="mag/i-05.webp" alt="" loading="lazy"><p class="syn">Every new tool gets called cheating: the camera, the synthesizer, spell check, auto-tune. This is a strutting reply to everyone still yelling from the hill. A tool can’t tell you what your vision means, and tomorrow arrives either way.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Built on 1980s Japanese technopop, from the years when the synthesizer was called the death of real music, right before it became the sound of Tokyo.</p><a class="play" href="./?play=4"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 05 · 4:04</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>13</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 06</div><div class="rule2"></div><img class="post" src="mag/p-06.webp" alt="The Voice at Platform Two poster"><div class="info"><div><p class="tja" lang="ja">今も、<br>黄色い線の内側に。</p><p class="ten">Still standing behind the yellow line.</p></div><dl><dt>GENRE</dt><dd>1970s Enka / Kayōkyoku</dd><dt>RUNTIME</dt><dd>04:43</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-06.webp" alt="" loading="lazy"><div class="theme">Attachment to the familiar, and unexpected grief</div><blockquote class="q">“I watched a woman disappear / Who’d never lived at all”</blockquote><p class="syn">Every morning the same recorded voice asks passengers to stand behind the yellow line. One Tuesday it’s replaced. The trains still run on time and nobody notices, except her. A routine software update becomes a quiet, genuine tragedy.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Inspired by Meiko Kaji’s Shura no Hana, theme of the 1973 film Lady Snowblood, later used by Tarantino in Kill Bill: Vol. 1.</p><a class="play" href="./?play=5"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 06 · 4:43</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>14</b></div></section></template><template><section class="pg chp v-wide"><div class="chtag">LAY-L AIR<br>CHANNEL 07</div><div class="rule2"></div><div class="wideimg"><img class="post" src="mag/p-07.webp" alt="Plastic Flower poster"><div class="ontag"><div><p class="tja" lang="ja">犯人は、<br>ウェイトレス。</p><p class="ten">The culprit: the waitress.</p></div></div></div><div class="strip"><dl><dt>GENRE</dt><dd>1960s Japanese Garage Rock / Surf</dd><dt>RUNTIME</dt><dd>03:12</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><img class="badge" src="mag/i-07.webp" alt="" loading="lazy"><div class="theme">The value of “worthless” things</div><blockquote class="q">“Who gave you permission to die? / You weren’t even alive!”</blockquote><p class="syn">A waitress throws away her favourite fake rose. Everyone says it’s replaceable; it was never alive. She buys an identical one, but it stands up much too straight. A trivial loss blown up into a shouted, fuzz-drenched catastrophe.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Channels The 5.6.7.8’s, the Tokyo garage-rock band who play the House of Blue Leaves scene in Kill Bill: Vol. 1.</p><a class="play" href="./?play=6"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 07 · 3:12</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>15</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 08</div><div class="rule2"></div><img class="post" src="mag/p-08.webp" alt="Crickets poster"><div class="info"><div><p class="tja" lang="ja">誰も、来なかった。</p><p class="ten">Nobody came.</p></div><dl><dt>GENRE</dt><dd>UK Garage / R&amp;B</dd><dt>RUNTIME</dt><dd>03:03</dd><dt>RATING</dt><dd><span class="rate">PG</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-08.webp" alt="" loading="lazy"><div class="theme">Silence, effort and one-sided friendship</div><blockquote class="q">“I thought we were losing touch / Turns out I was the touch”</blockquote><p class="syn">She was always the first call and the last to leave. So she went quiet, just to see who would come looking. Nobody did. Crickets is the sound of a one-sided friendship exposed by its own silence, and the strange relief of no longer carrying it alone.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>In Japan, the song of autumn insects is something people stop to listen to. Crickets were once kept in small bamboo cages for their voices. Here, that voice is the only one that answers.</p><a class="play" href="./?play=7"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 08 · 3:03</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>16</b></div></section></template><template><section class="pg chp v-quote"><div class="chtag">LAY-L AIR<br>CHANNEL 09</div><div class="rule2"></div><div class="theme">Patterns, nostalgia and the comfort of sadness</div><blockquote class="q">“Must be a pattern / Return to Saturn, return to sad-turn”</blockquote><div class="qrow"><img class="post" src="mag/p-09.webp" alt="SAdTURN poster"><div><div><p class="tja" lang="ja">また、同じ傷へ。</p><p class="ten">Back to the same wound.</p></div><dl><dt>GENRE</dt><dd>1970s Psychedelic Rock / Alternative Rock</dd><dt>RUNTIME</dt><dd>04:03</dd><dt>RATING</dt><dd><span class="rate">PG</span></dd></dl></div></div><img class="badge" src="mag/i-09.webp" alt="" loading="lazy"><p class="syn">Some people always reach for the songs that bruise: the minor keys, the endings they already know by heart. SAdTURN is about that loop, choosing the familiar ache over peace, and the question underneath it all: when will you learn?</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>The title folds three meanings into one word: sadness, the astrological “Saturn return”, and a nod to the 1990s Japanese game console that shared the planet’s name. The cover’s CONTINUE? screen asks the song’s question in arcade language.</p><a class="play" href="./?play=8"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 09 · 4:03</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>17</b></div></section></template><template><section class="pg chp v-wide"><div class="chtag">LAY-L AIR<br>CHANNEL 10</div><div class="rule2"></div><div class="wideimg"><img class="post" src="mag/p-10.webp" alt="ASMR Stimulation poster"><div class="ontag"><div><p class="tja" lang="ja">急がないで。</p><p class="ten">Don’t hurry.</p></div></div></div><div class="strip"><dl><dt>GENRE</dt><dd>Dark Electro-Funk / Alt R&amp;B</dd><dt>RUNTIME</dt><dd>03:20</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><img class="badge" src="mag/i-10.webp" alt="" loading="lazy"><div class="theme">Auditory pleasure and the seduction of anticipation</div><blockquote class="q">“Don’t get to the point / I prefer the scenic route”</blockquote><p class="syn">An ordinary conversation becomes a seduction. Pauses, breaths, pronunciation and polite bureaucratic phrases take on double meanings, and the whole game is in the waiting. Clicks, whispers and binaural stereo make the sound itself the object of desire.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Drawn from Japan’s deep ASMR culture: mimikaki (耳かき), binaural recording and intimate “situation voice” (シチュエーションボイス) performances.</p><a class="play" href="./?play=9"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 10 · 3:20</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>18</b></div></section></template><template><section class="pg chp v-std"><div class="chtag">LAY-L AIR<br>CHANNEL 11</div><div class="rule2"></div><img class="post" src="mag/p-11.webp" alt="Refrigerator poster"><div class="info"><div><p class="tja" lang="ja">英語、むずかしい。</p><p class="ten">English is hard.</p></div><dl><dt>GENRE</dt><dd>Y2K Cheer Pop / Hip-Pop</dd><dt>RUNTIME</dt><dd>03:03</dd><dt>RATING</dt><dd><span class="rate">PG</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-11.webp" alt="" loading="lazy"><div class="theme">Jealousy, language and attitude</div><blockquote class="q">“You like winter, cold like refrigerator / My bag is alligator”</blockquote><p class="syn">A jealous girlfriend, a cold boyfriend, and not quite enough English to say everything she feels, so she says it anyway. Refrigerator turns broken grammar into pure attitude: absurd, bouncy and completely sincere.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Anyone who learned English in Japan knows the flashcard: a picture, a word, and the katakana underneath to help you say it. リフリジレーター is a mouthful in any language, and the cover marks it wrong, with love.</p><a class="play" href="./?play=10"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 11 · 3:03</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>19</b></div></section></template><template><section class="pg chp v-quote"><div class="chtag">LAY-L AIR<br>CHANNEL 12</div><div class="rule2"></div><div class="theme">Memory, impermanence and unfinished things</div><blockquote class="q">“It comes to me in pieces / And leaves before it ends”</blockquote><div class="qrow"><img class="post" src="mag/p-12.webp" alt="The Wind Called In Sick poster"><div><div><p class="tja" lang="ja">最後の一行が、<br>思い出せない。</p><p class="ten">I can’t remember the last line.</p></div><dl><dt>GENRE</dt><dd>Japanese Romantic Waltz / Cinematic Chamber Pop</dd><dt>RUNTIME</dt><dd>03:09</dd><dt>RATING</dt><dd><span class="rate">G</span></dd></dl></div></div><img class="badge" src="mag/i-12.webp" alt="" loading="lazy"><p class="syn">One afternoon the wind simply stops. In the stillness, a woman sings from an upstairs window and never reaches the last line. The melody stays half-remembered until, walking home, she sings the ending wrong. A small waltz about memory and the beauty of unfinished things.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Inspired by Joe Hisaishi’s Merry-Go-Round of Life from Studio Ghibli’s Howl’s Moving Castle.</p><a class="play" href="./?play=11"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 12 · 3:09</a><div class="folio"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>20</b></div></section></template><template><section class="pg chp v-bonus"><div class="chtag">LAY-L AIR<br>CHANNEL 13<small>BONUS FLIGHT</small></div><div class="rule2"></div><img class="post" src="mag/p-13.webp" alt="Tamagotchi Luv poster"><div class="info"><div><p class="tja" lang="ja">それは、<br>愛なのか——？</p><p class="ten">Is that love—?</p></div><dl><dt>GENRE</dt><dd>Dark R&amp;B / Alt R&amp;B</dd><dt>RUNTIME</dt><dd>04:06</dd><dt>RATING</dt><dd><span class="rate">PG</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-13.webp" alt="" loading="lazy"><div class="theme">Conditional affection and the need to be needed</div><blockquote class="q">“You call it love but it’s luv with a u / You can’t call it love when it’s only you”</blockquote><p class="syn">Love as a virtual pet: fed when it’s convenient, ignored when it isn’t, kept alive at a distance. A 90s toy’s innocence against the control games of adult relationships, and the question of whether you care for someone or just like being needed.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Built on Tamagotchi, the virtual pet Bandai launched in Japan in November 1996.</p><a class="play" href="./?play=12"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 13 · 4:06</a><div class="folio dk"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>21</b></div></section></template><template><section class="pg chp v-bonus"><div class="chtag">LAY-L AIR<br>CHANNEL 14<small>BONUS FLIGHT</small></div><div class="rule2"></div><img class="post" src="mag/p-14.webp" alt="Voodoo Doll poster"><div class="info"><div><p class="tja" lang="ja">呪われたのは、誰？</p><p class="ten">Who’s the cursed one?</p></div><dl><dt>GENRE</dt><dd>Yé-yé Pop / Dark Pop</dd><dt>RUNTIME</dt><dd>04:13</dd><dt>RATING</dt><dd><span class="rate">15+</span></dd></dl></div><div class="rule2"></div><img class="badge" src="mag/i-14.webp" alt="" loading="lazy"><div class="theme">Revenge, theatre and a wink</div><blockquote class="q">“Hocus pocus, can’t you see? / The only disappearing act is you leaving me”</blockquote><p class="syn">He cheated; she’s a witch. Voodoo Doll is a theatrical revenge spell with a wink: the purse goes to a friend, the pin goes in the doll, and the only disappearing act left is him leaving.</p><p class="jn"><b>JAPAN <span lang="ja">日本</span></b>Japan has its own curse doll: the wara ningyō, a straw figure nailed to a shrine tree at the hour of the ox, between 1 and 3 a.m. On the cover it wears a striped necktie, so there is no doubt who it is for.</p><a class="play" href="./?play=13"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg> Play channel 14 · 4:13</a><div class="folio dk"><span>LAY-L AIR · ONE WAY · ISSUE 001</span><b>22</b></div></section></template><template><section class="pg duty-pg"><img class="bleed fill" src="mag/x-duty.webp" alt="Duty-free catalog: LAY-L AIR select goods"><a class="dutylink" href="./#shop">See the shop ▸︎</a><b class="dpn">23</b></section></template><template><section class="pg art"><img class="bleed fill" src="mag/x-travel1.webp" alt="Travel guide: illustrated map of Okinawa with six highlights"></section></template><template><section class="pg art"><img class="bleed fill" src="mag/x-travel2.webp" alt="Six Okinawa highlights"><div class="cap" style="left:2.8%;top:33.6%"><b>Shuri Castle 首里城</b><span>Royal palace of the old Ryukyu Kingdom, in Naha.</span></div><div class="cap" style="left:51.5%;top:33.6%"><b>Kokusai-dōri 国際通り</b><span>Naha’s main street of shops, bars and neon.</span></div><div class="cap" style="left:2.8%;top:62.8%"><b>Makishi Market 牧志公設市場</b><span>Pick a fish downstairs; it’s cooked upstairs.</span></div><div class="cap" style="left:51.5%;top:62.8%"><b>Cape Manzamo 万座毛</b><span>The elephant-trunk cliff at Onna.</span></div><div class="cap" style="left:2.8%;top:92.3%"><b>Churaumi Aquarium 美ら海水族館</b><span>Whale sharks behind a giant window.</span></div><div class="cap" style="left:51.5%;top:92.3%"><b>Kouri Island 古宇利島</b><span>A 2 km bridge over turquoise water.</span></div></section></template><template><section class="pg art"><img class="bleed fill" src="mag/x-btm1.webp?v=2" alt="LAY-L in the studio">
<div class="box" style="left:6%;top:72.5%;width:88%;height:24.5%"><p class="body s m">LAY-L is one crew of four: Lilac, Asmar, Yamm and Lattam. Every song on <i>Okinawa… One Way..</i> is a soundtrack to a film that doesn’t exist, each from a different decade of Japanese film and music.</p>
<p class="body s m">The band makes its music with modern tools, AI included, and says so openly. Channel 05, <i>Auntie A.I.</i>, is the band’s answer to anyone who calls that cheating.</p>
<p class="sign s">— Four different rhythms, one journey.</p></div></section></template><template><section class="pg art"><img class="bleed fill" src="mag/x-btm2.webp" alt="From idea to take-off: how a LAY-L song is made"><p class="step" style="top:22.4%">Every song starts as a small, true feeling: a missed call, a broken fridge.</p><p class="step" style="top:41.4%">Lyrics come first, rewritten until every line sounds like real speech.</p><p class="step" style="top:55.0%">Each song picks a decade and a genre from Japanese film and music.</p><p class="step" style="top:71.6%">Every track gets a poster for a film that doesn’t exist.</p><p class="step" style="top:88.1%">Storyboards and animation turn the poster into a music video.</p></section></template><template><section class="pg"><div class="lyhead"><img src="mag/x-lyrhead.webp?v=2" alt="Lyrics selections"></div>

(function(){ var PH=849;
  var tpls=[].slice.call(document.querySelectorAll("template")), N=tpls.length, one=false, V=[];
  var stage=document.getElementById("stage"), book=document.createElement("div"); book.className="book"; stage.appendChild(book);
  var L=document.createElement("div"),R=document.createElement("div"),sp=document.createElement("div");
  L.className="slot l";R.className="slot r";sp.className="spine";book.appendChild(L);book.appendChild(R);book.appendChild(sp);
  function build(){ V=[]; if(one){ for(var i=0;i<N;i++) V.push([i]); return; }
    V.push([null,0]); for(var i=1;i<N-1;i+=2) V.push([i,i+1<N-1?i+1:null]); V.push([N-1,null]); }
  function page(i){ if(i===null||i===undefined) return null; var d=document.createElement("div"); d.appendChild(tpls[i].content.cloneNode(true)); return d.firstElementChild; }
  function fill(slot,i){ slot.innerHTML=""; var e=page(i); if(e) slot.appendChild(e); }
  var cur=0, busy=false, zoom=false, RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var spacer=document.createElement("div"); spacer.className="spacer"; stage.appendChild(spacer);
  function size(){ var r=stage.getBoundingClientRect();
    if(zoom){ var z=Math.min(1.3,(r.width-8)/600*1.55); book.style.left="0"; book.style.top="0"; book.style.transform="scale("+z+")";
      spacer.style.width=(600*z+8)+"px"; spacer.style.height=(PH*z+8)+"px"; return; }
    book.style.left=""; book.style.top=""; spacer.style.width=spacer.style.height="0";
    var  w=one?600:1200, pad=innerWidth<820?8:76, s=Math.min((r.width-pad*2)/w,(r.height-16)/849);
    book.style.transform="scale("+s+") translate("+(-w/2)+"px,-424.5px)"; }
  function pad2(n){return (n<10?"0":"")+n;}
  function first(){ return V[cur].filter(function(x){return typeof x==="number";})[0]; }
  function status(){ var a=V[cur].filter(function(x){return typeof x==="number";}); var f=a[0]+1, l=a[a.length-1]+1;
    document.getElementById("pc").textContent=(f==l?pad2(f):pad2(f)+"–"+pad2(l))+" / "+pad2(N);
    document.getElementById("bar").style.width=(100*l/N)+"%";
    sp.style.display=(one||V[cur][0]===null||V[cur][1]===null)?"none":"";
    document.getElementById("prev").disabled=cur==0; document.getElementById("next").disabled=cur==V.length-1;
    try{history.replaceState(null,"","#p"+f);}catch(e){} }
  function show(){ fill(L,V[cur][0]); if(!one) fill(R,V[cur][1]); else R.innerHTML=""; status(); }
  function go(p){ for(var q=0;q<V.length;q++) if(V[q].indexOf(p)>=0){ cur=q; show(); return; } }
  function flip(dir){
    if(busy) return; var k=cur+dir; if(k<0||k>=V.length) return;
    if(zoom) setZoom(false); if(one||RM){ cur=k; L.classList.remove("in","inb"); void L.offsetWidth; fill(L,V[cur][0]); if(!RM) L.classList.add(dir>0?"in":"inb"); if(!one) fill(R,V[cur][1]); status(); stage.scrollTop=0; return; }
    busy=true;
    var A=V[cur], Bv=V[k], leaf=document.createElement("div"), fr=document.createElement("div"), bk=document.createElement("div");
    fr.className="face f"; bk.className="face b";
    var f1=page(dir>0?A[1]:A[0]), f2=page(dir>0?Bv[0]:Bv[1]); if(f1) fr.appendChild(f1); if(f2) bk.appendChild(f2);
    leaf.className="leaf "+(dir>0?"r":"l"); leaf.appendChild(fr); leaf.appendChild(bk); book.appendChild(leaf);
    if(dir>0) fill(R,Bv[1]); else fill(L,Bv[0]);
    sp.style.display="";
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ leaf.style.transform="rotateY("+(dir>0?-180:180)+"deg)"; }); });
    setTimeout(function(){ cur=k; if(dir>0) fill(L,Bv[0]); else fill(R,Bv[1]); leaf.remove(); status(); busy=false; }, 780);
  }
  function mode(){ var o=innerWidth<820||innerHeight>innerWidth*1.05; if(o===one&&V.length) return size(); if(!o&&zoom) setZoom(false);
    var p=V.length?first():0; one=o; document.body.classList.toggle("one",one); build(); cur=0; go(p); size(); }
  document.getElementById("prev").onclick=function(){flip(-1);};
  document.getElementById("next").onclick=function(){flip(1);};
  addEventListener("keydown",function(e){ if(e.key=="ArrowRight") flip(1); if(e.key=="ArrowLeft") flip(-1); });
  stage.addEventListener("click",function(e){ if(e.target.closest("a")) return; var ti=e.target.closest(".ti"); if(!ti||busy) return;
    var n=parseInt((ti.querySelector(".n")||{}).textContent,10); if(n) go(n-1); });
  addEventListener("resize",mode);
  function setZoom(on){ zoom=on; document.body.classList.toggle("zoom",on); var zb=document.getElementById("zoombtn"); if(zb){ zb.setAttribute("aria-pressed",on?"true":"false"); zb.textContent=on?"Fit page":"Zoom to read"; }
    size(); if(on){ stage.scrollTop=0; stage.scrollLeft=0; } }
  var zb=document.getElementById("zoombtn"); if(zb) zb.onclick=function(){ setZoom(!zoom); };
  var tx=0,ty=0,tt=0,lastTap=0;
  stage.addEventListener("touchstart",function(e){ if(e.touches.length!==1) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); },{passive:true});
  stage.addEventListener("touchend",function(e){ if(e.changedTouches.length!==1) return; var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty, dt=Date.now()-tt;
    if(!zoom && dt<600 && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5 && !(e.target.closest&&e.target.closest("a"))){ flip(dx<0?1:-1); return; }
    if(one && dt<250 && Math.abs(dx)<10 && Math.abs(dy)<10 && !(e.target.closest&&e.target.closest("a,.ti"))){ var n=Date.now(); if(n-lastTap<320){ setZoom(!zoom); lastTap=0; } else lastTap=n; } },{passive:true});
  var m=/#p(\d+)/.exec(location.hash), start=m?+m[1]-1:0;
  one=innerWidth<820||innerHeight>innerWidth*1.05; document.body.classList.toggle("one",one); build(); go(start); size();
})();
</script></body></html>
